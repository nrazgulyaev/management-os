<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #F1ECE0;
    --bg-2:       #F8F4EA;
    --bg-3:       #FFFCF4;
    --panel:      #FFFFFF;
    --line:       #E5DECC;
    --line-2:     #D8CFB7;
    --line-3:     #BAAF92;
    --concrete:   #2A2A26;
    --ink:        #14130E;
    --ink-2:      #3D3B33;
    --ink-3:      #6E6B5E;
    --ink-4:      #95917F;
    --carbon:     #14130E;
    --amber:      #FF6B35;
    --amber-soft: #FFB088;
    --steel:      #3D5A7A;
    --steel-soft: #7E9DBF;
    --lime:       #C9DC4A;
    --warn:       #C58A2E;
    --danger:     #C2474E;
    --ok:         #4F8A5D;
    --pastel-peach:  #F6D2BC;
    --pastel-sky:    #C9DCEA;
    --pastel-butter: #F0DE96;
    --pastel-mint:   #CBDFC8;
    --pastel-cream:  #ECE5D5;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); color: var(--ink); font-family:'Inter', system-ui, sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; background: transparent; border: 0; color: inherit; }
  ::selection { background: var(--amber); color: var(--carbon); }
  body::-webkit-scrollbar { width: 10px; }
  body::-webkit-scrollbar-track { background: var(--bg); }
  body::-webkit-scrollbar-thumb { background: var(--line-3); border-radius:999px; border:2px solid var(--bg); }

  .display { font-family:'Space Grotesk', sans-serif; font-weight:500; letter-spacing:-0.025em; line-height:1.02; }
  .mono { font-family:'IBM Plex Mono', monospace; font-feature-settings:"tnum"; }
  .num { font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .label { font-family:'IBM Plex Mono', monospace; text-transform:uppercase; font-size:10.5px; letter-spacing:0.18em; color: var(--ink-3); font-weight:400; }
  .label-amber { color: var(--amber); }

  /* Buttons */
  .btn { display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:500; border:1px solid transparent; transition: all .15s ease; white-space: nowrap; }
  .btn-amber { background: var(--amber); color: var(--carbon); }
  .btn-amber:hover { background: var(--amber-soft); }
  .btn-dark { background: var(--ink); color: var(--bg-3); }
  .btn-dark:hover { background: var(--ink-2); }
  .btn-secondary { background: var(--panel); color: var(--ink); border-color: var(--line-2); }
  .btn-secondary:hover { background: var(--bg-3); border-color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--ink-2); }
  .btn-ghost:hover { background: var(--bg-3); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-lg { padding: 11px 18px; font-size: 14px; }

  /* Panel + corner-marks */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; }
  .panel-2 { background: var(--bg-3); border: 1px solid var(--line); border-radius: 18px; }
  .corner-marks { position: relative; }
  .corner-marks::before { content: ""; position: absolute; top: 14px; left: 14px; width: 8px; height: 8px; border-radius: 999px; background: var(--amber); }

  /* Badge */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--line-2); background: var(--bg-3); color: var(--ink-3); border-radius: 999px; }
  .badge-ok    { color: var(--ok);     border-color: rgba(79,138,93,0.4);  background: rgba(79,138,93,0.10); }
  .badge-amber { color: var(--amber);  border-color: rgba(255,107,53,0.4);  background: rgba(255,107,53,0.10); }
  .badge-warn  { color: var(--warn);   border-color: rgba(197,138,46,0.4);  background: rgba(197,138,46,0.10); }
  .badge-danger{ color: var(--danger); border-color: rgba(194,71,78,0.4);   background: rgba(194,71,78,0.10); }
  .badge-steel { color: var(--steel);  border-color: rgba(61,90,122,0.4);   background: rgba(61,90,122,0.10); }
  .badge-ink   { background: var(--ink); color: var(--bg-3); border-color: var(--ink); }

  /* Field */
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field input, .field select, .field textarea { background: var(--bg-3); border: 1px solid var(--line-2); color: var(--ink); padding: 9px 12px; border-radius: 10px; font: inherit; outline: none; transition: border-color .15s ease; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--amber); }

  /* Tables */
  table.data { width:100%; border-collapse: collapse; font-size:13px; }
  table.data th, table.data td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.data th { font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:0.12em; color: var(--ink-3); background: var(--bg-2); border-bottom: 1px solid var(--line-2); }
  table.data tbody tr:hover { background: var(--bg-2); }
  table.data td.num, table.data th.num { text-align: right; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  /* Sidebar */
  .sidebar { width: 264px; background: var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; height: 100vh; position: sticky; top: 0; overflow-y: auto; flex-shrink: 0; }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--line-2); border-radius:999px; }
  .sb-group { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .sb-group:last-child { border-bottom: 0; }
  .sb-group-title { font-family:'IBM Plex Mono', monospace; text-transform: uppercase; font-size: 9.5px; letter-spacing: 0.18em; color: var(--ink-4); padding: 10px 18px 6px; }
  .sb-item { display:flex; align-items:center; gap:10px; padding: 7px 18px; font-size:13.5px; color:var(--ink-2); cursor:pointer; border:0; background:transparent; width:100%; text-align:left; border-left: 2px solid transparent; transition: background .12s ease, color .12s ease; }
  .sb-item:hover { background: var(--bg-3); }
  .sb-item.on { color: var(--ink); font-weight: 500; background: var(--bg-3); border-left-color: var(--amber); }
  .sb-item .sb-badge { margin-left: auto; font-family:'IBM Plex Mono', monospace; font-size:10px; padding: 1px 6px; border-radius: 999px; background: var(--bg-2); color: var(--ink-3); }

  /* Topbar */
  .topbar { position: sticky; top: 0; z-index: 30; background: rgba(248,244,234,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 12px 28px; display:flex; align-items:center; gap: 16px; }
  .crumb { display:flex; align-items:center; gap: 8px; font-size: 12.5px; color: var(--ink-3); font-family:'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em; }
  .crumb b { color: var(--ink); font-weight: 500; }
  .topbar-search { position: relative; width: 320px; }
  .topbar-search input { width:100%; padding:7px 12px 7px 32px; border:1px solid var(--line-2); border-radius:999px; background: var(--bg-3); outline: none; font-size: 13px; }
  .topbar-search .sx { position: absolute; left: 10px; top: 8px; color: var(--ink-4); }
  .kbd { font-family:'IBM Plex Mono', monospace; font-size: 10px; padding: 1px 6px; border:1px solid var(--line-2); border-radius: 6px; color: var(--ink-3); }

  /* KPI tile */
  .kpi { background: var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size: 10.5px; }
  .kpi .v { font-family:'IBM Plex Mono', monospace; font-size: 26px; margin-top:4px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
  .kpi .sub { margin-top: 3px; font-size: 12px; color: var(--ink-3); }
  .kpi.accent .v { color: var(--amber); }
  .kpi.success .v { color: var(--ok); }
  .kpi.steel .v { color: var(--steel); }

  ul.clean { list-style:none; padding:0; margin:0; }
  ul.clean li { padding: 8px 0; border-bottom: 1px solid var(--line); display:flex; align-items:center; gap:10px; }
  ul.clean li:last-child { border-bottom: 0; }

  html, body { overflow-x: hidden; }
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .topbar { padding: 10px 16px; flex-wrap: wrap; }
    .topbar-search { width: 100%; order: 99; }
    [style*="repeat(3, 1fr)"], [style*="repeat(4, 1fr)"], [style*="repeat(5, 1fr)"], [style*="repeat(6, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; }
    [style*="1fr 1fr"], [style*="1.4fr 1fr"], [style*="1.6fr 1fr"], [style*="1.5fr 1fr"], [style*="1.2fr 1fr"] { grid-template-columns: 1fr !important; }
    table { display: block; overflow-x: auto; }
  }
  @media (max-width: 600px) {
    [style*="repeat(2, 1fr)"], [style*="repeat(3, 1fr)"] { grid-template-columns: 1fr !important; }
  }
</style>

            <div style={{height:"100%", width:"58%", background:"var(--amber)"}}></div>
          </div>
        </div>
      </div>
      {DevNav.map(g=>(
        <div className="sb-group" key={g.g}>
          <div className="sb-group-title">{g.g}</div>
          {g.items.map(it=>{
            const isActive = it.k === activeKey;
            return (
              <a key={it.k} href={it.href || "#"} className={"sb-item " + (isActive ? "on" : "")}>{it.l}{it.badge && <span className="sb-badge">{it.badge}</span>}</a>
            );
          })}
        </div>
      ))}
    </aside>
  );
}

function Topbar({ breadcrumbs = [], actions }) {
  return (
    <header className="topbar">
      <div className="crumb">
        {breadcrumbs.map((b, i)=>(<React.Fragment key={i}><span style={{color: i===breadcrumbs.length-1 ? "var(--ink)" : "var(--ink-3)", fontWeight: i===breadcrumbs.length-1 ? 500 : 400}}>{b}</span>{i < breadcrumbs.length-1 && <span>/</span>}</React.Fragment>))}
      </div>
      <div style={{marginLeft:"auto", display:"flex", alignItems:"center", gap:10}}>
        <div className="topbar-search">
          <span className="sx"><_I.search width="14" height="14"/></span>
          <input placeholder="Search project, BOQ line, vendor, asset…"/>
          <span className="kbd" style={{position:"absolute", right:10, top:6}}>⌘K</span>
        </div>
        {actions}
        <button style={{position:"relative", padding:6, color:"var(--ink-2)"}}><_I.bell width="17" height="17"/><span style={{position:"absolute", top:4, right:4, width:7, height:7, borderRadius:999, background:"var(--amber)"}}></span></button>
        <span className="badge badge-amber" style={{fontSize:9}}>DEMO</span>
        <div style={{display:"flex", alignItems:"center", gap:8, paddingLeft:8, borderLeft:"1px solid var(--line)"}}>
          <div style={{width:30, height:30, borderRadius:999, background:"var(--amber)", color:"var(--carbon)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:600, fontFamily:"'Space Grotesk', sans-serif"}}>NR</div>
          <div style={{display:"flex", flexDirection:"column", lineHeight:1.1}}>
            <span style={{fontSize:13, fontWeight:500}}>Nikita R.</span>
            <span style={{fontSize:10.5, color:"var(--ink-3)"}}>Director</span>
          </div>
        </div>
      </div>
    </header>
  );
}

function CabinetPage({ activeKey, current, breadcrumbs, actions, children }) {
  return (
    <div style={{display:"flex", minHeight:"100vh", background:"var(--bg)"}}>
      <Sidebar activeKey={activeKey} current={current}/>
      <main style={{flex:1, minWidth:0}}>
        <Topbar breadcrumbs={breadcrumbs} actions={actions}/>
        <div style={{padding:"24px 28px 80px", maxWidth:1480}}>
          {children}
        </div>
      </main>
    </div>
  );
}

function Kpi({ label, value, sub, tone }) {
  return (
    <div className={"kpi " + (tone ? tone : "")}>
      <div className="label">{label}</div>
      <div className="v">{value}</div>
      {sub && <div className="sub">{sub}</div>}
    </div>
  );
}

function SectionHeading({ eyebrow, title, subtitle, actions }) {
  return (
    <div style={{display:"flex", alignItems:"flex-end", gap:18, marginBottom:22}}>
      <div style={{flex:1, minWidth:0}}>
        {eyebrow && <div className="label label-amber">{eyebrow}</div>}
        <h1 className="display" style={{fontSize:42, margin:"6px 0 0", fontWeight:500}}>{title}</h1>
        {subtitle && <p style={{margin:"8px 0 0", color:"var(--ink-3)", fontSize:15, maxWidth:680}}>{subtitle}</p>}
      </div>
      {actions && <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>{actions}</div>}
    </div>
  );
}

window.DevShell = { Sidebar, Topbar, CabinetPage, Kpi, SectionHeading };
</script>
