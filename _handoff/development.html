<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Arconique Development OS — build the next one</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Light canvas — cream/concrete base, dark ink */
    --bg:         #F1ECE0;
    --bg-2:       #F8F4EA;
    --bg-3:       #FFFCF4;
    --panel:      #FFFFFF;
    --line:       #E5DECC;
    --line-2:     #D8CFB7;
    --line-3:     #BAAF92;
    --concrete:   #2A2A26;
    --concrete-2: #4A4A42;
    --concrete-3: #6E6E64;
    --ink:        #14130E;
    --ink-2:      #3D3B33;
    --ink-3:      #6E6B5E;
    --ink-4:      #95917F;
    --carbon:     #14130E;          /* dark text on amber/accent buttons */
    --amber:      #FF6B35;
    --amber-soft: #FFB088;
    --steel:      #3D5A7A;
    --steel-soft: #7E9DBF;
    --lime:       #C9DC4A;
    --warn:       #C58A2E;
    --danger:     #C2474E;
    --ok:         #4F8A5D;

    /* Sticker / bento pastels */
    --pastel-peach:  #F6D2BC;
    --pastel-sky:    #C9DCEA;
    --pastel-butter: #F0DE96;
    --pastel-mint:   #CBDFC8;
    --pastel-cream:  #ECE5D5;
    --pastel-rose:   #EFC6BD;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif; font-size: 14.5px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; background: transparent; border: 0; color: inherit; }
  html { scroll-behavior: smooth; }
  ::selection { background: var(--amber); color: var(--carbon); }

  body::-webkit-scrollbar { width: 10px; }
  body::-webkit-scrollbar-track { background: var(--bg); }
  body::-webkit-scrollbar-thumb { background: var(--line-3); border-radius: 999px; border: 2px solid var(--bg); }

  .display { font-family: 'Space Grotesk', sans-serif; font-weight: 500; letter-spacing: -0.025em; line-height: 1.0; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-feature-settings: "tnum"; }
  .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .label { font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; font-size: 11px; letter-spacing: 0.18em; color: var(--ink-3); font-weight: 400; }
  .label-amber { color: var(--amber); }
  .hr { height: 1px; background: var(--line); }
  .hr-dashed { background-image: linear-gradient(90deg, var(--line-2) 50%, transparent 50%); background-size: 6px 1px; background-repeat: repeat-x; height: 1px; }

  /* Blueprint grid background */
  .grid-paper {
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(20,19,14,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20,19,14,0.05) 1px, transparent 1px),
      linear-gradient(rgba(20,19,14,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20,19,14,0.025) 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    background-position: -1px -1px, -1px -1px, -1px -1px, -1px -1px;
  }
  .grid-light {
    background-color: var(--bg-2);
    background-image:
      linear-gradient(rgba(20,19,14,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20,19,14,0.06) 1px, transparent 1px),
      linear-gradient(rgba(20,19,14,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20,19,14,0.03) 1px, transparent 1px),
      linear-gradient(rgba(20,19,14,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20,19,14,0.03) 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
  }

  /* Construction site placeholder */
  .photo-site {
    background:
      repeating-linear-gradient(135deg, rgba(20,19,14,0.04) 0 1px, transparent 1px 18px),
      linear-gradient(160deg, var(--pastel-peach) 0%, #E2B095 100%);
  }
  .photo-blueprint {
    background:
      linear-gradient(rgba(61,90,122,0.18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61,90,122,0.18) 1px, transparent 1px),
      linear-gradient(160deg, var(--pastel-sky) 0%, #A8BFD2 100%);
    background-size: 40px 40px, 40px 40px, auto;
  }

  /* Cards */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; }
  .panel-2 { background: var(--bg-3); border: 1px solid var(--line); border-radius: 18px; }
  .corner-marks { position: relative; }
  .corner-marks::before, .corner-marks::after {
    content: ""; position: absolute; width: 8px; height: 8px; border-radius: 999px; background: var(--amber); opacity: 0.85;
  }
  .corner-marks::before { top: 14px; left: 14px; }
  .corner-marks::after  { display: none; }

  /* Sticker pastel face — for selective cards on dark base */
  .panel-peach  { background: var(--pastel-peach);  color: #2a1b13; border-color: rgba(0,0,0,0.05); }
  .panel-sky    { background: var(--pastel-sky);    color: #14202c; border-color: rgba(0,0,0,0.05); }
  .panel-butter { background: var(--pastel-butter); color: #2b240e; border-color: rgba(0,0,0,0.05); }
  .panel-mint   { background: var(--pastel-mint);   color: #142318; border-color: rgba(0,0,0,0.05); }
  .panel-cream  { background: var(--pastel-cream);  color: #1d1a14; border-color: rgba(0,0,0,0.05); }
  .panel-amber  { background: var(--amber);         color: var(--carbon);  border-color: rgba(0,0,0,0.05); }
  .panel-peach .label, .panel-sky .label, .panel-butter .label, .panel-mint .label, .panel-cream .label, .panel-amber .label { color: rgba(0,0,0,0.55); }
  .panel-peach .label-amber, .panel-mint .label-amber, .panel-sky .label-amber, .panel-butter .label-amber, .panel-cream .label-amber, .panel-amber .label-amber { color: rgba(0,0,0,0.7); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; letter-spacing: 0.01em; transition: all .15s ease; white-space: nowrap; border: 1px solid transparent; }
  .btn-amber { background: var(--amber); color: var(--carbon); }
  .btn-amber:hover { background: var(--amber-soft); }
  .btn-light { background: var(--ink); color: #fff; }
  .btn-light:hover { background: var(--ink); }
  .btn-dark { background: var(--bg-3); color: var(--ink); border-color: var(--line-2); }
  .btn-dark:hover { background: var(--bg-2); border-color: var(--line-3); }
  .btn-ghost { background: transparent; color: var(--ink-2); }
  .btn-ghost:hover { color: var(--ink); }
  .btn-lg { padding: 14px 22px; font-size: 14px; }

  /* Round arrow button — sticker style */
  .ra-btn { width:46px; height:46px; border-radius:999px; background:var(--amber); color:var(--carbon); display:inline-flex; align-items:center; justify-content:center; border:0; transition:transform .15s ease, background .15s ease; flex-shrink:0; }
  .ra-btn:hover { transform: translateX(2px); background: var(--amber-soft); }
  .ra-btn.dark { background: var(--bg-3); color: var(--ink); border:1px solid var(--line-2); }
  .ra-btn.light { background: var(--panel); color: var(--ink); border:1px solid var(--line); }

  /* Badge — pill / sticker */
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid; border-radius: 999px; }
  .badge-ok    { color: var(--ok);     border-color: rgba(79,190,106,0.4);  background: rgba(79,190,106,0.10); }
  .badge-amber { color: var(--amber);  border-color: rgba(255,107,53,0.4);  background: rgba(255,107,53,0.10); }
  .badge-warn  { color: var(--warn);   border-color: rgba(230,162,60,0.4);  background: rgba(230,162,60,0.10); }
  .badge-danger{ color: var(--danger); border-color: rgba(215,70,77,0.4);   background: rgba(215,70,77,0.10); }
  .badge-steel { color: var(--steel-soft); border-color: rgba(125,157,191,0.4); background: rgba(125,157,191,0.10); }
  .badge-soft  { color: var(--ink-2);  border-color: var(--line-2);         background: var(--bg-3); }

  /* Sticker chip — pill with bullet (light face) */
  .chip { display:inline-flex; align-items:center; gap:8px; padding: 7px 13px; background: var(--bg-2); border:1px solid var(--line-2); border-radius: 999px; font-size: 12.5px; color: var(--ink-2); }
  .chip-dot::before { content:""; width:7px; height:7px; border-radius:999px; background: var(--amber); display:inline-block; }
  .chip-light { background: var(--pastel-cream); color: #1d1a14; border-color: rgba(0,0,0,0.06); }
  .chip-glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-color: rgba(255,255,255,0.1); color: var(--ink); }

  /* Mini avatar stack */
  .avstack { display:inline-flex; }
  .avstack > * { width: 22px; height: 22px; border-radius:999px; border: 2px solid var(--bg); margin-left:-7px; background: var(--bg-3); }
  .avstack > *:first-child { margin-left: 0; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field input, .field select, .field textarea {
    background: var(--bg-2); border: 1px solid var(--line-2); color: var(--ink);
    padding: 11px 14px; border-radius: 12px; font: inherit; outline: none; transition: border-color .15s ease;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--amber); }

  /* Pulse dot */
  .pulse-amber::before {
    content:""; display:inline-block; width:6px; height:6px; border-radius:999px; background: var(--amber); margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.55); }
    50%     { box-shadow: 0 0 0 5px rgba(255,107,53,0); }
  }

  /* Tables */
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th, table.data td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.data th { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3); background: var(--bg-2); border-bottom: 1px solid var(--line-2); }
  table.data tbody tr:hover { background: var(--bg-2); }
  table.data td.num, table.data th.num { text-align: right; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  .stamp { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px dashed var(--line-2); border-radius: 999px; color: var(--ink-3); font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; }

  /* Decorative crosshair */
  .crosshair { position: relative; }
  .crosshair::before, .crosshair::after { content: ""; position: absolute; background: var(--amber); }
  .crosshair::before { left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-50%); }
  .crosshair::after  { top: 50%; left: 0; right: 0; height: 1px; transform: translateY(-50%); }

  @media (max-width: 760px) { .hide-mobile { display: none !important; } }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

</head>

<script type="text/jsx-source" data-file="shared.js">
/* global React */
const { useState, useEffect, useCallback } = React;

// Icons (thin, technical)
const I = {
  arrow: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M5 12h14M13 6l6 6-6 6"/></svg>,

  plus: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M12 5v14M5 12h14"/></svg>,
  download: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M12 4v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg>,
  external: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M14 4h6v6M20 4l-9 9M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>,
  spreadsheet: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16"/></svg>,
  hammer: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M14 5l5 5-9 9-5-5 9-9zM12 7l5 5M3 21l3-3"/></svg>,

  truck: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><rect x="2" y="8" width="11" height="9"/><path d="M13 11h5l3 3v3h-8M5 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>,
  shield: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3z"/></svg>,
  user: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><circle cx="12" cy="8" r="4"/><path d="M4 20c2-4 6-5 8-5s6 1 8 5"/></svg>,
  spark: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M12 3v4m0 10v4M3 12h4m10 0h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>,
  search: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>,
  bell: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M6 8a6 6 0 1 1 12 0c0 5 2 7 2 7H4s2-2 2-7zM10 19a2 2 0 0 0 4 0"/></svg>,
  building: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><rect x="4" y="3" width="16" height="18"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M9 16h6"/></svg>,
  cube: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M12 2L4 6v12l8 4 8-4V6l-8-4zM4 6l8 4 8-4M12 22V10"/></svg>,
  receipt: (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M5 3v18l3-2 3 2 3-2 3 2 3-2V3l-3 2-3-2-3 2-3-2-3 2zM9 9h6M9 13h6"/></svg>,
  logoMark: (p)=><svg viewBox="0 0 32 32" fill="none" {...p}><rect x="4" y="4" width="24" height="24" stroke="currentColor" strokeWidth="1.5"/><path d="M10 22 V12 H22 M10 17 H22" stroke="currentColor" strokeWidth="1.5"/></svg>,
};

// Top nav (sticky)
function DevNav({ go, route }) {
  const navItems = [
    { l: "Platform",  to: "landing#platform" },
    { l: "Cabinets",  to: "landing#cabinets" },
    { l: "AI agents", to: "landing#ai" },
    { l: "Investors", to: "landing#investors" },
    { l: "Pricing",   to: "landing#pricing" },
  ];
  return (
    <header style={{position:"sticky", top:0, zIndex:60, background:"rgba(248,244,234,0.82)", backdropFilter:"blur(14px)", WebkitBackdropFilter:"blur(14px)", borderBottom:"1px solid var(--line)"}}>
      <div style={{maxWidth:1360, margin:"0 auto", padding:"14px 28px", display:"flex", alignItems:"center", gap:24}}>
        <a onClick={(e)=>{e.preventDefault(); go("landing");}} href="#landing" style={{display:"flex", alignItems:"center", gap:10}}>
          <span style={{color:"var(--amber)"}}><I.logoMark width="22" height="22"/></span>
          <span style={{fontFamily:"'Space Grotesk', sans-serif", fontSize:18, letterSpacing:"-0.01em", fontWeight:500}}>ARCONIQUE</span>
          <span className="badge badge-amber" style={{fontSize:10}}>DEV.OS</span>
        </a>
        <nav className="hide-mobile" style={{display:"flex", gap:22, marginLeft:18, fontSize:13}}>
          {navItems.map(n=>(
            <a key={n.l} href={"#"+n.to} onClick={(e)=>{e.preventDefault(); go(n.to);}} style={{color:"var(--ink-2)"}}>{n.l}</a>
          ))}
        </nav>
        <div style={{marginLeft:"auto", display:"flex", gap:10, alignItems:"center"}}>
          <a onClick={(e)=>{e.preventDefault(); go("boq");}} className="hide-mobile mono" style={{fontSize:12, color:"var(--ink-3)", letterSpacing:"0.05em"}}>OPEN.LIVE.DEMO →</a>
          <button className="btn btn-ghost hide-mobile" onClick={()=>go("login")}>Sign in</button>
          <button className="btn btn-amber" onClick={()=>go("signup")}>Start trial <I.arrow width="13" height="13"/></button>
        </div>
      </div>
    </header>
  );
}

function DevFooter({ go }) {
  return (
    <footer style={{borderTop:"1px solid var(--line)", background:"var(--bg)"}}>
      <div style={{maxWidth:1360, margin:"0 auto", padding:"56px 28px 36px"}}>
        <div style={{display:"grid", gridTemplateColumns:"1.6fr 1fr 1fr 1fr 1fr", gap:36}}>
          <div>
            <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:14}}>
              <span style={{color:"var(--amber)"}}><I.logoMark width="22" height="22"/></span>
              <span className="display" style={{fontSize:18}}>ARCONIQUE</span>
              <span className="badge badge-amber" style={{fontSize:10}}>DEV.OS</span>
            </div>
            <p style={{color:"var(--ink-3)", fontSize:13.5, maxWidth:340, margin:0}}>
              The construction operating system for boutique villa, condotel and resort developers in Southeast Asia. Built on jobsites in Bali.
            </p>
            <p className="mono" style={{marginTop:18, fontSize:11, color:"var(--ink-4)"}}>development.arconique.com</p>
          </div>
          {[
            { h:"Platform",   items:[["Tour","landing#platform"],["Cabinets","landing#cabinets"],["AI agents","landing#ai"],["Investors","investor"],["Pricing","landing#pricing"]] },
            { h:"Demo",       items:[["BOQ desk","boq"],["Investor portal","investor"],["Sign in","login"],["Start trial","signup"]] },
            { h:"Resources",  items:[["Spec sheet PDF","#"],["ROI calculator","#"],["Customer stories","#"],["Implementation guide","#"]] },
            { h:"Legal",      items:[["Terms","#"],["Privacy","#"],["DPA","#"],["Status","#"]] },
          ].map((col,i)=>(
            <div key={i}>
              <div className="label" style={{marginBottom:14}}>{col.h}</div>
              <ul style={{listStyle:"none", padding:0, margin:0, display:"flex", flexDirection:"column", gap:9}}>
                {col.items.map(([l, to])=>(
                  <li key={l}><a onClick={(e)=>{ if(to!=="#"){e.preventDefault(); go(to);} }} href={"#"+to} style={{color:"var(--ink-2)", fontSize:13}}>{l}</a></li>
                ))}
              </ul>
            </div>
          ))}
        </div>
        <div style={{marginTop:48, paddingTop:20, borderTop:"1px solid var(--line)", display:"flex", justifyContent:"space-between", alignItems:"center", fontSize:11, color:"var(--ink-4)"}} className="mono">
          <span>© 2026 ARCONIQUE OS · MADE BETWEEN BALI AND BERLIN</span>
          <span>BUILD 09H · UPTIME 99.98%</span>
        </div>
      </div>
    </footer>
  );
}

function useHashRoute(initial="landing") {
  const [route, setRoute] = useState(() => window.location.hash.replace("#","") || initial);
  useEffect(() => {
    const fn = () => {
      const h = window.location.hash.replace("#","");
      setRoute(h || initial);
      const i = h.indexOf("#");
      if (i > -1) {
        const anchor = h.slice(i+1);
        requestAnimationFrame(()=>{ const el = document.getElementById(anchor); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); });
      } else {
        window.scrollTo({top:0});
      }
    };
    window.addEventListener("hashchange", fn);
    return () => window.removeEventListener("hashchange", fn);
  }, [initial]);
  const go = useCallback((to)=>{ window.location.hash = "#"+to; }, []);
  return [route, go];
}

function VarianceTrend() {
  const points = [-0.2, 0.3, 0.5, 0.4, 0.8, 0.6, 1.0, 0.7, 0.5, 0.9, 1.2, 1.4];
  const max = 1.5;
  const w = 480, h = 160, pad=20;
  const path = points.map((p, i) => {
    const x = pad + (i / (points.length-1)) * (w - pad*2);
    const y = h/2 - (p / max) * (h/2 - pad);
    return (i===0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  return (
    <div className="panel" style={{padding:18}}>
      <div style={{display:"flex", alignItems:"center", marginBottom:14}}>
        <h2 className="display" style={{margin:0, fontSize:18}}>Cost variance · 12 weeks</h2>

      </div>
      <div style={{position:"relative"}}>
        <svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%", height:160}}>
          {/* grid */}
          {[0.5, 1, -0.5, -1].map((g,i)=>{
            const y = h/2 - (g / max) * (h/2 - pad);
            return <line key={i} x1={pad} y1={y} x2={w-pad} y2={y} stroke="var(--line)" strokeWidth="0.6" strokeDasharray="3 3"/>;
          })}
          <line x1={pad} y1={h/2} x2={w-pad} y2={h/2} stroke="var(--line-2)" strokeWidth="1"/>
          {/* path */}
          <path d={path} stroke="var(--amber)" strokeWidth="2" fill="none"/>
          {points.map((p, i)=>{
            const x = pad + (i / (points.length-1)) * (w - pad*2);
            const y = h/2 - (p / max) * (h/2 - pad);
            return <circle key={i} cx={x} cy={y} r="3" fill={i===points.length-1 ? "var(--amber)" : "var(--bg)"} stroke="var(--amber)" strokeWidth="1.5"/>;
          })}
          {/* y labels */}
          <text x="2" y={h/2+3} fill="var(--ink-4)" fontFamily="IBM Plex Mono" fontSize="9">0%</text>
          <text x="2" y={h/2 - (1/max)*(h/2-pad)+3} fill="var(--ink-4)" fontFamily="IBM Plex Mono" fontSize="9">+1%</text>
          <text x="2" y={h/2 + (1/max)*(h/2-pad)+3} fill="var(--ink-4)" fontFamily="IBM Plex Mono" fontSize="9">-1%</text>
        </svg>
      </div>
      <div style={{display:"flex", justifyContent:"space-between", marginTop:8, fontSize:10, color:"var(--ink-4)"}} className="mono">
        {["W25","W27","W29","W31","W33","W35"].map((w,i)=><span key={i}>{w}</span>)}
      </div>
      <div className="hr" style={{margin:"14px 0"}}></div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:10, fontSize:12}}>
        <div>

    }
    requestAnimationFrame(follow);

    document.addEventListener('mouseenter', () => { dot.style.opacity = '1'; ring.style.opacity = '1'; });
    document.addEventListener('mouseleave', () => { dot.style.opacity = '0'; ring.style.opacity = '0'; });

    document.addEventListener('mouseover', e => {
      const t = e.target;
      if (!t || !t.closest) return;
      const interactive = t.closest('a, button, [role="button"], input, textarea, select, [data-cursor-hover]');
      if (interactive) {
        dot.classList.add('cursor-hover');
        ring.classList.add('cursor-hover');
        if (interactive.matches('input, textarea, select')) {
          ring.classList.add('cursor-text');
        }
        const labelText = interactive.dataset && interactive.dataset.cursorLabel;
        if (labelText) {
          label.textContent = labelText;
          label.classList.add('cursor-show');
        }
      }
    });
    document.addEventListener('mouseout', e => {
      const t = e.target;
      if (!t || !t.closest) return;
      const interactive = t.closest('a, button, [role="button"], input, textarea, select, [data-cursor-hover]');
      if (interactive) {
        dot.classList.remove('cursor-hover');
        ring.classList.remove('cursor-hover');
        ring.classList.remove('cursor-text');
        label.classList.remove('cursor-show');
      }
    });

    document.addEventListener('mousedown', () => { ring.style.transform += ' scale(0.85)'; });
    document.addEventListener('mouseup',   () => { /* will be reset by next frame */ });
  }

  /* ============ Scroll progress bar ============ */
  const progress = document.createElement('div');
  progress.className = 'scroll-progress';
  document.body.appendChild(progress);
  function updateProgress() {
    const h = document.documentElement;
    const pct = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100;
    progress.style.width = Math.min(100, pct) + '%';
  }

  /* ============ Auto-tag sections + reveal ============ */
  function autoTagSections() {
    document.querySelectorAll("section").forEach((s) => {
      if (!s.hasAttribute("data-reveal") && !s.closest("[data-no-reveal]")) {
        s.setAttribute("data-reveal", "up");
      }
    });
  }

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("in");
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });

  function scanReveal() {
    autoTagSections();
    document.querySelectorAll("[data-reveal]:not(.in), [data-reveal-mask]:not(.in), [data-text-reveal]:not(.in), [data-text-reveal-char]:not(.in)").forEach(el => io.observe(el));
  }

  /* ============ Word & char splitting ============ */
  function splitWords(node, idx = { i: 0 }) {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === Node.TEXT_NODE) {
        const text = child.textContent;
        if (!text.trim()) continue;
        const frag = document.createDocumentFragment();
        text.split(/(\s+)/).forEach(w => {
          if (!w) return;
          if (!w.trim()) { frag.appendChild(document.createTextNode(w)); return; }
          const wrap = document.createElement('span'); wrap.className = 'word';
          const inner = document.createElement('span');
          inner.textContent = w;
          inner.style.transitionDelay = (idx.i * 0.05) + 's';
          idx.i++;
          wrap.appendChild(inner);
          frag.appendChild(wrap);
        });
        child.replaceWith(frag);
      } else if (child.nodeType === Node.ELEMENT_NODE && !child.classList.contains('word')) {
        splitWords(child, idx);
      }
    }
  }
  function splitChars(node) {
    const text = node.textContent;
    node.textContent = '';
    [...text].forEach((c, i) => {
      const s = document.createElement('span');
      s.className = 'char';
      s.textContent = c === ' ' ? '\u00a0' : c;
      s.style.transitionDelay = (i * 0.025) + 's';
      node.appendChild(s);
    });
  }
  function scanTextReveal() {
    document.querySelectorAll('[data-text-reveal]:not([data-text-reveal-done])').forEach(el => {
      el.dataset.textRevealDone = '1';
      splitWords(el);
    });
    document.querySelectorAll('[data-text-reveal-char]:not([data-text-reveal-done])').forEach(el => {
      el.dataset.textRevealDone = '1';
      splitChars(el);
    });
  }

  /* ============ Parallax ============ */
  let parallaxEls = [];
  function refreshParallax() {
    parallaxEls = [];
    document.querySelectorAll("[data-parallax]").forEach(el => {
      const rect = el.getBoundingClientRect();
      parallaxEls.push({
        el,
        speed: parseFloat(el.dataset.parallax) || 0.2,
        anchor: rect.top + window.scrollY + rect.height / 2,
      });
    });
  }
  let ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      const vh = window.innerHeight;
      parallaxEls.forEach(p => {
        const dy = (y + vh / 2 - p.anchor) * p.speed;
        p.el.style.transform = "translate3d(0," + dy.toFixed(1) + "px,0)";
      });
      updateProgress();
      ticking = false;
    });
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", () => { refreshParallax(); updateProgress(); }, { passive: true });

  /* ============ Count-up ============ */
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function formatNum(n, raw) {
    if (raw.includes(",") && n >= 1000) return Math.round(n).toLocaleString();
    if (n % 1 !== 0) return n.toFixed(1);
    return Math.round(n).toString();
  }
  function animateCount(el) {
    const target = parseFloat(el.dataset.count);
    if (isNaN(target)) return;
    const prefix = el.dataset.countPrefix || "";
    const suffix = el.dataset.countSuffix || "";
    const dur = 1500;
    const t0 = performance.now();
    const raw = el.textContent.trim();
    function step(now) {
      const t = Math.min(1, (now - t0) / dur);
      const v = target * easeOutCubic(t);
      el.textContent = prefix + formatNum(v, raw) + suffix;
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  const cio = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      animateCount(e.target);
      cio.unobserve(e.target);
    });
  }, { threshold: 0.5 });
  function scanCounts() {
    document.querySelectorAll("[data-count]:not([data-count-done])").forEach(el => {
      el.dataset.countDone = "1";
      cio.observe(el);
    });
  }

  /* ============ Magnetic hover ============ */
  function bindMagnetic() {
    document.querySelectorAll(".ra-btn, .btn-amber, .btn-primary, .btn-terra").forEach(el => {
      if (el.dataset.magBound) return;
      el.dataset.magBound = "1";
      el.style.transition = (el.style.transition || "") + ", transform .2s cubic-bezier(.22,1,.36,1)";
      el.addEventListener("mousemove", (e) => {
        const r = el.getBoundingClientRect();
        const x = (e.clientX - r.left - r.width / 2) / r.width * 16;
        const y = (e.clientY - r.top - r.height / 2) / r.height * 16;
        el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
      });
      el.addEventListener("mouseleave", () => { el.style.transform = ""; });
    });
  }

  function tick() {
    scanTextReveal();
    scanReveal();
    scanCounts();
    refreshParallax();
    bindMagnetic();
    updateProgress();
  }

  if (document.readyState !== "loading") setTimeout(tick, 120);
  else document.addEventListener("DOMContentLoaded", () => setTimeout(tick, 120));

  new MutationObserver(() => {
    clearTimeout(window.__motionDebounce);
    window.__motionDebounce = setTimeout(tick, 80);
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>

</body>
</html>
