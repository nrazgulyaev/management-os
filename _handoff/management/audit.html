<!doctype html>
<!-- 
  CABINET TEMPLATE — Management OS
  Used as the base for every management/*.html cabinet file.
  Includes:
    - design tokens (cream / forest / terracotta / gold palette)
    - React + Babel + bootstrap
    - Sidebar component with full nav tree
    - Topbar with breadcrumbs + search + bell + user
    - Cabinet content slot (replace data-cabinet-slot)
    - Real demo data (villas / owners / metrics / staff)
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Audit log · Arconique Management OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:        #F4EFE6;
    --cream-deep:   #ECE5D5;
    --cream-warm:   #FAF7F1;
    --paper:        #FFFCF7;
    --ink:          #14201C;
    --ink-2:        #2A3934;
    --ink-3:        #4A5A55;
    --ink-4:        #7E8A85;
    --forest:       #1F3A33;
    --forest-deep:  #122621;
    --terra:        #C4583C;
    --terra-soft:   #E48A6E;
    --gold:         #BC9A5C;
    --gold-soft:    #DCC691;
    --sage:         #88A89A;
    --line:         #DAD2C0;
    --line-soft:    #E5DECC;
    --line-strong:  #C2B89E;
    --ok:           #4F7A5D;
    --warn:         #C58A2E;
    --danger:       #B14638;
    --info:         #3D5A7A;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--cream); color: var(--ink); font-family:'Inter', system-ui, sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; background: transparent; border: 0; color: inherit; }
  ::selection { background: var(--terra); color: var(--cream-warm); }
  body::-webkit-scrollbar { width: 10px; }
  body::-webkit-scrollbar-track { background: var(--cream); }
  body::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius:999px; border:2px solid var(--cream); }

  .display { font-family:'Newsreader', Georgia, serif; font-weight:400; letter-spacing:-0.02em; line-height:1.02; }
  .display em { font-style: italic; color: var(--terra); font-weight: 400; }
  .label { font-family:'JetBrains Mono', monospace; text-transform:uppercase; font-size:10.5px; letter-spacing:0.16em; color: var(--ink-3); font-weight:400; }
  .mono { font-family:'JetBrains Mono', monospace; font-feature-settings:"tnum"; }
  .num { font-family:'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .hr { height:1px; background: var(--line-soft); }

  /* Buttons */
  .btn { display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:500; border:1px solid transparent; transition: all .15s ease; white-space: nowrap; }
  .btn-primary { background: var(--ink); color: var(--cream-warm); }
  .btn-primary:hover { background: var(--forest); }
  .btn-terra   { background: var(--terra); color: var(--cream-warm); }
  .btn-terra:hover { background: #a44627; }
  .btn-secondary { background: var(--cream-warm); color: var(--ink); border-color: var(--line); }
  .btn-secondary:hover { background: var(--paper); border-color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--ink-2); }
  .btn-ghost:hover { background: var(--cream-deep); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-lg { padding: 11px 18px; font-size: 14px; }

  /* Card */
  .card { background: var(--paper); border:1px solid var(--line-soft); border-radius:16px; }

  /* Badge */
  .badge { display:inline-flex; align-items:center; gap:4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-family:'JetBrains Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; border:1px solid var(--line); background: var(--cream-warm); color: var(--ink-3); }
  .badge-ok    { background: rgba(79,122,93,0.10); color: var(--ok); border-color: rgba(79,122,93,0.25); }
  .badge-warn  { background: rgba(196,88,60,0.10); color: var(--terra); border-color: rgba(196,88,60,0.25); }
  .badge-gold  { background: rgba(188,154,92,0.12); color: #8c6f33; border-color: rgba(188,154,92,0.30); }
  .badge-info  { background: rgba(61,90,122,0.08); color: var(--info); border-color: rgba(61,90,122,0.25); }
  .badge-ink   { background: var(--ink); color: var(--cream-warm); border-color: var(--ink); }
  .badge-danger{ background: rgba(177,70,56,0.10); color: var(--danger); border-color: rgba(177,70,56,0.25); }

  /* Pulse */
  .pulse-dot { width: 6px; height: 6px; border-radius:999px; background: var(--ok); display:inline-block; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(79,122,93,0.55); }
    50%     { box-shadow: 0 0 0 6px rgba(79,122,93,0); }
  }

  /* Tables */
  table.data { width:100%; border-collapse: collapse; }
  table.data th, table.data td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line-soft); vertical-align: middle; font-size:13px; }
  table.data th { font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:0.14em; color: var(--ink-3); background: var(--cream-warm); border-bottom: 1px solid var(--line); }
  table.data tbody tr:hover { background: var(--cream-warm); }
  table.data td.num, table.data th.num { text-align: right; font-family:'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  /* Field */
  .field { display:flex; flex-direction:column; gap:5px; }
  .field input, .field select, .field textarea { appearance:none; border:1px solid var(--line); background: var(--paper); color: var(--ink); padding: 9px 12px; border-radius: 10px; font: inherit; outline: none; transition: border-color .15s ease; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ink); }

  /* Photo placeholder textures */
  .photo-villa { background: linear-gradient(160deg, #c89e6c 0%, #a17a4a 45%, #5e4628 100%); }
  .photo-pool { background: linear-gradient(180deg, #4a7264 0%, #2c4a40 100%); }
  .photo-suite { background: linear-gradient(160deg, #e5d2b2 0%, #b78f5d 100%); }
  .photo-warm { background: linear-gradient(160deg, #d8c19a 0%, #c2986a 38%, #a07645 100%); }

  /* Sidebar */
  .sidebar { width: 264px; background: var(--paper); border-right:1px solid var(--line-soft); display:flex; flex-direction:column; height: 100vh; position: sticky; top: 0; overflow-y: auto; flex-shrink: 0; }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--line); border-radius:999px; }
  .sb-group { padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
  .sb-group:last-child { border-bottom: 0; }
  .sb-group-title { font-family:'JetBrains Mono', monospace; text-transform: uppercase; font-size: 9.5px; letter-spacing: 0.18em; color: var(--ink-4); padding: 10px 18px 6px; display: flex; align-items: center; gap: 6px; }
  .sb-item { display:flex; align-items:center; gap:10px; padding: 7px 18px; font-size:13.5px; color:var(--ink-2); cursor:pointer; border:0; background:transparent; width:100%; text-align:left; border-left: 2px solid transparent; transition: background .12s ease, color .12s ease; }
  .sb-item:hover { background: var(--cream-warm); }
  .sb-item.on { color: var(--ink); font-weight: 500; background: var(--cream-warm); border-left-color: var(--terra); }
  .sb-item .sb-badge { margin-left: auto; font-family:'JetBrains Mono', monospace; font-size:10px; padding: 1px 6px; border-radius: 999px; background: var(--cream-deep); color: var(--ink-3); }
  .sb-item.on .sb-badge { background: var(--terra); color: var(--cream-warm); }
  .sb-sub { padding-left: 32px; padding-top: 2px; padding-bottom: 2px; font-size: 12.5px; }
  .sb-sub.on { background: transparent; border-left-color: var(--terra); color: var(--terra); }

  /* Topbar */
  .topbar { position: sticky; top: 0; z-index: 30; background: rgba(244,239,230,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-soft); padding: 12px 28px; display:flex; align-items:center; gap: 16px; }
  .crumb { display:flex; align-items:center; gap: 8px; font-size: 12.5px; color: var(--ink-3); font-family:'JetBrains Mono', monospace; }
  .crumb b { color: var(--ink); font-weight: 500; }
  .topbar-search { position: relative; width: 320px; }
  .topbar-search input { width:100%; padding:7px 12px 7px 32px; border:1px solid var(--line); border-radius:999px; background: var(--paper); outline: none; font-size: 13px; }
  .topbar-search .sx { position: absolute; left: 10px; top: 8px; color: var(--ink-4); }
  .kbd { font-family:'JetBrains Mono', monospace; font-size: 10px; padding: 1px 6px; border:1px solid var(--line); border-radius: 6px; color: var(--ink-3); }

  /* Tiles / KPIs */
  .kpi { background: var(--paper); border:1px solid var(--line-soft); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size: 10.5px; }
  .kpi .v { font-family:'JetBrains Mono', monospace; font-size: 26px; margin-top:4px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
  .kpi .sub { margin-top: 3px; font-size: 12px; color: var(--ink-3); }
  .kpi.accent .v { color: var(--terra); }
  .kpi.success .v { color: var(--ok); }
  .kpi.gold .v { color: var(--gold); }

  /* Inline list */
  ul.clean { list-style:none; padding:0; margin:0; }
  ul.clean li { padding: 8px 0; border-bottom: 1px solid var(--line-soft); display:flex; align-items:center; gap:10px; }
  ul.clean li:last-child { border-bottom: 0; }

  /* Mobile */
  html, body { overflow-x: hidden; }
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .topbar { padding: 10px 16px; flex-wrap: wrap; }
    .topbar-search { width: 100%; order: 99; }
    [style*="repeat(3, 1fr)"], [style*="repeat(4, 1fr)"], [style*="repeat(5, 1fr)"], [style*="repeat(6, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; }
    [style*="1fr 1fr"], [style*="1.4fr 1fr"], [style*="1.6fr 1fr"] { grid-template-columns: 1fr !important; }
    table { display: block; overflow-x: auto; }
  }
  @media (max-width: 600px) {
    [style*="repeat(2, 1fr)"], [style*="repeat(3, 1fr)"] { grid-template-columns: 1fr !important; }
  }
</style>

            return (
              <a key={it.k} href={it.href || "#"} className={"sb-item " + ((isActive || isCurrent) ? "on" : "")}>
                {it.l}
                {it.badge && <span className="sb-badge">{it.badge}</span>}
              </a>
            );
          })}
        </div>
      ))}
    </aside>
  );
}

function Topbar({ breadcrumbs = [], actions }) {
  return (
    <header className="topbar">
      <div className="crumb">
        {breadcrumbs.map((b, i) => (
          <React.Fragment key={i}>
            <span style={{color: i === breadcrumbs.length - 1 ? "var(--ink)" : "var(--ink-3)", fontWeight: i === breadcrumbs.length - 1 ? 500 : 400}}>{b}</span>

}

function CabinetPage({ activeKey, current, breadcrumbs, actions, children }) {

}

/* small helpers */
function Kpi({ label, value, sub, tone }) {

function SectionHeading({ eyebrow, title, subtitle, actions }) {

}
