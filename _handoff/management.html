<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Arconique Management OS — operate the portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:        #F4EFE6;
    --cream-deep:   #ECE5D5;
    --cream-warm:   #FAF7F1;
    --paper:        #FFFCF7;
    --ink:          #14201C;
    --ink-2:        #2A3934;
    --ink-3:        #4A5A55;
    --ink-4:        #7E8A85;
    --forest:       #1F3A33;
    --forest-deep:  #122621;
    --forest-fade:  #2E4F47;
    --terra:        #C4583C;
    --terra-soft:   #E48A6E;
    --gold:         #BC9A5C;
    --gold-soft:    #DCC691;
    --sage:         #88A89A;
    --line:         #DAD2C0;
    --line-soft:    #E5DECC;
    --line-strong:  #C2B89E;
    --ok:           #4F7A5D;
    --warn:         #C58A2E;

    /* Sticker / pastel system (bento) */
    --mint:         #D8E8D6;
    --mint-deep:    #B6D3B2;
    --peach:        #F6D9CB;
    --peach-deep:   #EDB89F;
    --butter:       #F5E9B8;
    --butter-deep:  #E8D77E;
    --sky:          #D4E2EC;
    --sky-deep:     #A8C1D4;
    --shadow-card:  0 1px 0 rgba(255,255,255,0.6) inset, 0 12px 30px -18px rgba(20,32,28,0.18);
    --shadow-soft:  0 18px 40px -24px rgba(20,32,28,0.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  .display { font-family: 'Newsreader', Georgia, serif; font-weight: 400; letter-spacing: -0.02em; line-height: 1.02; }
  .display em { font-style: italic; color: var(--terra); font-weight: 400; }
  .label { font-family: 'JetBrains Mono', monospace; text-transform: uppercase; font-size: 11px; letter-spacing: 0.16em; color: var(--ink-3); font-weight: 400; }
  .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum"; }
  .num { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
  .hr-soft { height: 1px; background: var(--line-soft); }
  .hr-line { height: 1px; background: var(--line); }
  ::selection { background: var(--terra); color: var(--cream-warm); }

  /* Scroll */
  html { scroll-behavior: smooth; }
  body::-webkit-scrollbar { width: 10px; }
  body::-webkit-scrollbar-track { background: var(--cream); }
  body::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; border: 2px solid var(--cream); }

  /* Photo placeholder — striped warm */
  .photo-warm {
    background:
      repeating-linear-gradient(135deg, rgba(31,58,51,0.06) 0 1px, transparent 1px 18px),
      linear-gradient(160deg, #d8c19a 0%, #c2986a 38%, #a07645 100%);
  }
  .photo-villa {
    background:
      radial-gradient(120% 80% at 50% 80%, rgba(31,58,51,0.45), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 24px),
      linear-gradient(180deg, #c89e6c 0%, #a17a4a 45%, #5e4628 100%);
  }
  .photo-pool {
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 22px),
      linear-gradient(180deg, #4a7264 0%, #2c4a40 100%);
  }
  .photo-suite {
    background:
      repeating-linear-gradient(135deg, rgba(31,58,51,0.05) 0 1px, transparent 1px 16px),
      linear-gradient(160deg, #e5d2b2 0%, #b78f5d 100%);
  }

  .grain::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
    background-image:
      radial-gradient(rgba(20,32,28,0.06) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px;
    mix-blend-mode: multiply;
  }

  /* Buttons */
  .btn { display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; border:1px solid transparent; transition: all .18s ease; white-space: nowrap; }
  .btn-primary { background: var(--ink); color: var(--cream-warm); }
  .btn-primary:hover { background: var(--forest); }
  .btn-secondary { background: var(--cream-warm); color: var(--ink); border-color: var(--line); }
  .btn-secondary:hover { background: var(--paper); border-color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--ink); }
  .btn-ghost:hover { background: var(--cream-deep); }
  .btn-terra { background: var(--terra); color: var(--cream-warm); }
  .btn-terra:hover { background: #a44627; }
  .btn-lg { padding: 14px 22px; font-size: 15px; }

  /* Cards */
  .card { background: var(--paper); border: 1px solid var(--line-soft); border-radius: 18px; }
  .card-tight { border-radius: 14px; }
  .ring { border: 1px solid var(--line); }

  /* Bento — sticker style */
  .bento { background: var(--paper); border-radius: 28px; border: 1px solid rgba(218,210,192,0.5); box-shadow: var(--shadow-card); position: relative; }
  .bento-mint   { background: var(--mint);   border-color: rgba(122,160,118,0.20); }
  .bento-peach  { background: var(--peach);  border-color: rgba(196,88,60,0.18); }
  .bento-butter { background: var(--butter); border-color: rgba(188,154,92,0.22); }
  .bento-sky    { background: var(--sky);    border-color: rgba(60,90,140,0.18); }
  .bento-ink    { background: var(--forest-deep); color: var(--cream-warm); border-color: var(--forest); }
  .bento-cream  { background: var(--paper); }
  .bento-bare   { background: transparent; box-shadow: none; }

  /* Sticker chip — pill with bullet + text + optional avatars */
  .chip { display:inline-flex; align-items:center; gap:8px; padding: 7px 12px; background: var(--paper); border:1px solid rgba(218,210,192,0.7); border-radius: 999px; font-size: 13px; color: var(--ink-2); box-shadow: 0 2px 0 rgba(0,0,0,0.02); }
  .chip-dot::before { content:""; width:8px; height:8px; border-radius:999px; background: var(--terra); display:inline-block; }
  .chip-glass { background: rgba(255,252,247,0.9); backdrop-filter: blur(10px); }
  .chip-ink   { background: var(--ink); color: var(--cream-warm); border-color: transparent; }

  /* Mini avatar stack */
  .avstack { display:inline-flex; }
  .avstack > * { width: 22px; height: 22px; border-radius:999px; border: 2px solid var(--paper); margin-left:-7px; background: var(--cream-deep); }
  .avstack > *:first-child { margin-left: 0; }

  /* Section number tag */
  .sec-num { display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace; font-size:11px; padding:5px 11px; border:1px solid var(--line); border-radius:999px; background: var(--paper); color: var(--ink-3); letter-spacing:0.1em; text-transform:uppercase; }

  /* Round arrow button */
  .ra-btn { width:48px; height:48px; border-radius:999px; background:var(--ink); color:var(--cream-warm); display:inline-flex; align-items:center; justify-content:center; border:0; transition:transform .15s ease; }
  .ra-btn:hover { transform: translateX(2px); }
  .ra-btn.light { background:var(--paper); color:var(--ink); border:1px solid var(--line); }

  /* Inline icon-in-headline glyphs */
  .glyph { display:inline-flex; vertical-align:-0.05em; margin: 0 0.08em; padding: 0.12em 0.32em; border-radius: 999px; }
  .glyph-mint { background: var(--mint); }
  .glyph-peach { background: var(--peach); }
  .glyph-butter { background: var(--butter); }
  .glyph-terra { background: var(--terra); color: var(--cream-warm); }

  /* Tiles overlay on hero */
  .tile {
    background: rgba(255,252,247,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(218,210,192,0.5);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 16px 40px -20px rgba(20,32,28,0.4);
  }
  .tile-dark {
    background: rgba(31,58,51,0.86);
    backdrop-filter: blur(12px);
    color: var(--cream-warm);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px 16px;
  }

  /* Pulse */
  .pulse::before {
    content:""; display:inline-block; width:6px; height:6px; border-radius:999px; background: var(--ok); margin-right: 6px;
    animation: pulse 2s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(79,122,93,0.55);
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(79,122,93,0.45); }
    50%     { box-shadow: 0 0 0 6px rgba(79,122,93,0); }
  }

  /* Form */
  .field { display:flex; flex-direction:column; gap: 6px; }
  .field input, .field select, .field textarea {
    appearance: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    padding: 11px 14px; border-radius: 10px; font: inherit; outline: none; transition: border-color .15s ease;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ink); }

  /* Stepper */
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--line-strong); }
  .dot.on { background: var(--ink); }

  /* Demo specific */
  .stat-card { background: var(--paper); border: 1px solid var(--line-soft); border-radius: 14px; padding: 16px 18px; }
  .badge { display:inline-flex; align-items:center; gap:4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--line); }
  .badge-ok  { background: rgba(79,122,93,0.10); color: var(--ok); border-color: rgba(79,122,93,0.25); }
  .badge-warn{ background: rgba(196,88,60,0.10); color: var(--terra); border-color: rgba(196,88,60,0.25); }
  .badge-gold{ background: rgba(188,154,92,0.12); color: #8c6f33; border-color: rgba(188,154,92,0.30); }
  .badge-ink { background: var(--ink); color: var(--cream-warm); border-color: var(--ink); }

  /* Table */
  table.guests { width: 100%; border-collapse: collapse; }
  table.guests th, table.guests td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--line-soft); font-size: 14px; vertical-align: middle; }
  table.guests th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-3); font-weight: 500; background: var(--cream); }
  table.guests tbody tr:hover { background: var(--cream); }

  /* Skip anchor visual */
  .anchor-target { scroll-margin-top: 88px; }

  /* Loading shimmer for kabinet preview */
  .shimmer { position: relative; overflow: hidden; background: var(--cream-deep); }
  .shimmer::after { content:""; position:absolute; inset:0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.5) 50%, transparent 70%); animation: sh 1.6s infinite; }
  @keyframes sh { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  /* Tweaks */
  .tweak-fab { position: fixed; right: 18px; bottom: 18px; z-index: 80; }

  /* Mobile */
  @media (max-width: 760px) {
    .display.h1 { font-size: 48px !important; }
    .hide-mobile { display: none !important; }
  }
</style>

<script type="text/jsx-source">
/* ======= shared.js ======= */
/* global React */
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ============================================================
// Icons (inline SVG, line style)
// ============================================================
const I = {
  arrow: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M5 12h14M13 6l6 6-6 6"/></svg>,
  arrowDown: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M12 5v14M6 13l6 6 6-6"/></svg>,
  check: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" {...p}><path d="M4 12l5 5L20 6"/></svg>,
  dot: (p) => <svg viewBox="0 0 24 24" fill="currentColor" {...p}><circle cx="12" cy="12" r="4"/></svg>,
  bed: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M3 18V8m0 6h18m0 0v4m0-4v-2a3 3 0 0 0-3-3h-5v5M3 8h6"/></svg>,
  key: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><circle cx="8" cy="15" r="4"/><path d="M11 13l9-9m-3 3l2 2"/></svg>,
  receipt: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M5 3v18l3-2 3 2 3-2 3 2 3-2V3l-3 2-3-2-3 2-3-2-3 2zM9 9h6M9 13h6"/></svg>,
  spark: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M12 3v4m0 10v4M3 12h4m10 0h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>,
  globe: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>,
  shield: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3z"/></svg>,
  phone: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>,
  calendar: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>,
  msg: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M21 12a8 8 0 0 1-12.2 6.8L3 20l1.2-5.8A8 8 0 1 1 21 12z"/></svg>,
  user: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><circle cx="12" cy="8" r="4"/><path d="M4 20c2-4 6-5 8-5s6 1 8 5"/></svg>,
  search: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>,
  bell: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M6 8a6 6 0 1 1 12 0c0 5 2 7 2 7H4s2-2 2-7zM10 19a2 2 0 0 0 4 0"/></svg>,
  external: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M14 4h6v6M20 4l-9 9M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>,
  download: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M12 4v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg>,
  chart: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M4 20V8M10 20V4M16 20v-8M22 20H2"/></svg>,
  logo: (p) => <svg viewBox="0 0 32 32" fill="none" {...p}><path d="M16 4 L26 22 H6 Z" stroke="currentColor" strokeWidth="1.5" fill="none"/><path d="M11 22 L16 13 L21 22" stroke="currentColor" strokeWidth="1.5" fill="none"/></svg>,
};

// ============================================================
// Top nav (sticky)
// ============================================================
function MgmtNav({ go, route }) {
  const navItems = [
    { l: "Product",  to: "landing#product"  },
    { l: "Cabinets", to: "landing#cabinets" },
    { l: "Concierge AI", to: "landing#ai" },
    { l: "Owners",   to: "landing#owner" },
    { l: "Pricing",  to: "landing#pricing" },
  ];
  const onLanding = route.startsWith("landing");
  return (
    <header style={{position:"sticky", top:0, zIndex:60, background:"rgba(244,239,230,0.78)", backdropFilter:"blur(14px)", WebkitBackdropFilter:"blur(14px)", borderBottom:"1px solid var(--line-soft)"}}>
      <div style={{maxWidth:1320, margin:"0 auto", padding:"14px 28px", display:"flex", alignItems:"center", gap:24}}>
        <a onClick={(e)=>{e.preventDefault(); go("landing");}} href="#landing" style={{display:"flex", alignItems:"center", gap:10}}>
          <span style={{color:"var(--forest)"}}><I.logo width="22" height="22"/></span>
          <span style={{fontFamily:"'Newsreader', serif", fontSize:20, letterSpacing:"-0.01em"}}>Arconique</span>
          <span className="label" style={{marginLeft:2, padding:"2px 8px", border:"1px solid var(--line)", borderRadius:999, fontSize:10}}>Management</span>
        </a>
        <nav className="hide-mobile" style={{display:"flex", gap:22, marginLeft:18, fontSize:14}}>
          {navItems.map((n)=>(
            <a key={n.l} href={"#"+n.to} onClick={(e)=>{e.preventDefault(); go(n.to);}} style={{color:"var(--ink-3)"}}>
              {n.l}
            </a>
          ))}
        </nav>
        <div style={{marginLeft:"auto", display:"flex", gap:10, alignItems:"center"}}>
          <a onClick={(e)=>{e.preventDefault(); go("frontoffice");}} className="hide-mobile" style={{fontSize:14, color:"var(--ink-3)"}}>Live demo →</a>
          <button className="btn btn-ghost hide-mobile" onClick={()=>go("login")}>Sign in</button>
          <button className="btn btn-primary" onClick={()=>go("signup")}>Start trial</button>
        </div>
      </div>
    </header>
  );
}

// ============================================================
// Footer
// ============================================================
function MgmtFooter({ go }) {
  return (
    <footer style={{borderTop:"1px solid var(--line-soft)", marginTop:0, background:"var(--cream)"}}>
      <div style={{maxWidth:1320, margin:"0 auto", padding:"56px 28px 36px"}}>
        <div style={{display:"grid", gridTemplateColumns:"1.5fr 1fr 1fr 1fr 1fr", gap:32}}>
          <div>
            <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:14}}>
              <span style={{color:"var(--forest)"}}><I.logo width="22" height="22"/></span>
              <span style={{fontFamily:"'Newsreader', serif", fontSize:20}}>Arconique</span>
            </div>
            <p style={{color:"var(--ink-3)", fontSize:14, maxWidth:320, margin:0}}>
              The operating system for premium hospitality. Built in Bali for villa and boutique-hotel operators worldwide.
            </p>
            <p className="mono" style={{marginTop:18, fontSize:12, color:"var(--ink-4)"}}>management.arconique.com</p>
          </div>
          {[
            { h: "Product", items: [["Tour", "landing#product"], ["Cabinets","landing#cabinets"], ["Concierge AI", "landing#ai"], ["Owners", "owner"], ["Pricing","landing#pricing"]]},
            { h: "Demo", items: [["Front office","frontoffice"], ["Owner portal","owner"], ["Sign in", "login"], ["Start trial","signup"]]},
            { h: "Company", items: [["About","#"], ["Customers","#"], ["Contact","#"], ["Careers","#"]]},
            { h: "Legal", items: [["Terms","#"], ["Privacy","#"], ["DPA","#"], ["Status","#"]]},
          ].map((col, i)=>(
            <div key={i}>
              <div className="label" style={{marginBottom:14}}>{col.h}</div>
              <ul style={{listStyle:"none", padding:0, margin:0, display:"flex", flexDirection:"column", gap:9}}>
                {col.items.map(([l, to])=>(
                  <li key={l}><a onClick={(e)=>{ if(to!=="#"){e.preventDefault(); go(to);} }} href={"#"+to} style={{color:"var(--ink-3)", fontSize:14}}>{l}</a></li>
                ))}
              </ul>
            </div>
          ))}
        </div>
        <div style={{marginTop:48, paddingTop:20, borderTop:"1px solid var(--line-soft)", display:"flex", justifyContent:"space-between", alignItems:"center", fontSize:12, color:"var(--ink-4)"}}>
          <span className="mono">© 2026 Arconique OS · Made between Bali and Berlin</span>
          <span className="mono">v9I · uptime 99.98%</span>
        </div>
      </div>
    </footer>
  );
}

// ============================================================
// Hash router
// ============================================================
function useHashRoute(initial="landing") {
  const [route, setRoute] = useState(() => {
    const h = window.location.hash.replace("#","");
    return h || initial;
  });
  useEffect(() => {
    const fn = () => {
      const h = window.location.hash.replace("#","");
      setRoute(h || initial);
      // scroll to anchor if present
      const i = h.indexOf("#");
      if (i > -1) {
        const anchor = h.slice(i+1);
        requestAnimationFrame(()=>{
          const el = document.getElementById(anchor);
          if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
        });
      } else {
        window.scrollTo({top:0});
      }
    };
    window.addEventListener("hashchange", fn);
    return () => window.removeEventListener("hashchange", fn);
  }, [initial]);
  const go = useCallback((to) => {
    window.location.hash = "#" + to;
  }, []);
  return [route, go];
}

window.MgmtShared = { I, MgmtNav, MgmtFooter, useHashRoute };

    ring = document.createElement('div'); ring.className = 'cursor-ring';
    label = document.createElement('div'); label.className = 'cursor-label';

      mx = e.clientX; my = e.clientY;
      dot.style.transform = `translate3d(${mx}px,${my}px,0) translate(-50%,-50%)`;
      label.style.transform = `translate3d(${mx}px,${my}px,0) translate(-50%, calc(-50% + 40px))`;
    }, { passive: true });

    function follow() {
      rx += (mx - rx) * 0.18;
      ry += (my - ry) * 0.18;
      ring.style.transform = `translate3d(${rx.toFixed(1)}px,${ry.toFixed(1)}px,0) translate(-50%,-50%)`;
      requestAnimationFrame(follow);

        dot.classList.add('cursor-hover');

    document.querySelectorAll(".ra-btn, .btn-amber, .btn-primary, .btn-terra").forEach(el => {
      if (el.dataset.magBound) return;
      el.dataset.magBound = "1";
