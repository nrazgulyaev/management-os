<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arconique · Auth suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style id="auth-chrome">
/* ===== ds/tokens.css ===== */
/* ============================================================
   Arconique Design System — tokens
   Layer B (product-scoped). Layer A legacy is being deprecated.
   ============================================================ */

/* Management OS — warm hospitality */
[data-product="management"],
[data-product="owner"] {
  /* Surfaces */
  --cream:        #F4EFE6;
  --cream-deep:   #ECE5D5;
  --cream-warm:   #FAF7F1;
  --paper:        #FFFCF7;

  /* Ink */
  --ink:          #14201C;
  --ink-2:        #2A3934;
  --ink-3:        #4A5A55;
  --ink-4:        #7E8A85;

  /* Brand */
  --forest:       #1F3A33;
  --forest-deep:  #122621;
  --forest-fade:  #2E4F47;
  --terra:        #C4583C;
  --terra-soft:   #E48A6E;
  --gold:         #BC9A5C;
  --gold-soft:    #DCC691;
  --sage:         #88A89A;

  /* Lines */
  --line:         #DAD2C0;
  --line-soft:    #E5DECC;
  --line-strong:  #C2B89E;

  /* Semantic */
  --ok:           #4F7A5D;
  --warn:         #C58A2E;
  --danger:       #B14132;
  --info:         #3D5A7A;

  /* Accent pastels (bento cards, status pills) */
  --mint:         #D8E8D6;
  --mint-deep:    #B6D3B2;
  --peach:        #F6D9CB;
  --peach-deep:   #EDB89F;
  --butter:       #F5E9B8;
  --butter-deep:  #E8D77E;
  --sky:          #D4E2EC;
  --sky-deep:     #A8C1D4;

  /* Type */
  --display-font: 'Newsreader', Georgia, 'Iowan Old Style', serif;
  --sans-font:    'Inter', system-ui, -apple-system, sans-serif;
  --mono-font:    'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

  /* Radii */
  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-card: 18px;
  --r-card-lg: 22px;
  --r-hero: 28px;
  --r-pill: 999px;

  /* Shadows */
  --shadow-card:  0 1px 0 rgba(255,255,255,0.6) inset,
                  0 12px 30px -18px rgba(20,32,28,0.18);
  --shadow-soft:  0 18px 40px -24px rgba(20,32,28,0.22);
  --shadow-pop:   0 24px 56px -28px rgba(20,32,28,0.28),
                  0 2px 6px rgba(20,32,28,0.06);

  /* Accent role (used by .btn-primary semantics) */
  --accent:           var(--terra);
  --accent-deep:      #A44627;
  --accent-soft:      var(--terra-soft);
  --on-accent:        var(--cream-warm);
  --inverted-bg:      var(--forest);
  --inverted-bg-deep: var(--forest-deep);
  --inverted-fg:      var(--cream-warm);
}

/* Owner Portal — same palette, slightly calmer */
[data-product="owner"] {
  /* Owner is for non-technical users, used 2–4× per month.
     Inherits Mgmt palette. The differentiation is density/sizing —
     applied at the component level, not via different tokens. */
}

/* Development OS — engineering grade */
[data-product="development"] {
  /* Surfaces */
  --bg:           #F1ECE0;
  --bg-2:         #F8F4EA;
  --bg-3:         #FFFCF4;
  --panel:        #FFFFFF;

  /* Compatibility aliases (cards/topbars look up --paper/--cream too) */
  --paper:        var(--panel);
  --cream:        var(--bg);
  --cream-warm:   var(--bg-2);
  --cream-deep:   var(--bg-2);

  /* Lines */
  --line:         #E5DECC;
  --line-2:       #D8CFB7;
  --line-3:       #BAAF92;
  --line-soft:    #ECE6D5;
  --line-strong:  var(--line-3);

  /* Ink */
  --concrete:     #2A2A26;
  --concrete-2:   #4A4A42;
  --concrete-3:   #6E6E64;
  --ink:          #14130E;
  --ink-2:        #3D3B33;
  --ink-3:        #6E6B5E;
  --ink-4:        #95917F;
  --carbon:       #14130E;

  /* Brand */
  --amber:        #FF6B35;
  --amber-soft:   #FFB088;
  --amber-deep:   #D8541F;
  --steel:        #3D5A7A;
  --steel-soft:   #7E9DBF;
  --lime:         #C9DC4A;

  /* Semantic */
  --ok:           #4F8A5D;
  --warn:         #C58A2E;
  --danger:       #C2474E;
  --info:         var(--steel);

  /* Pastels (status/event tags) */
  --pastel-peach:  #F6D2BC;
  --pastel-sky:    #C9DCEA;
  --pastel-butter: #F0DE96;
  --pastel-mint:   #CBDFC8;
  --pastel-cream:  #ECE5D5;
  --pastel-rose:   #EFC6BD;

  /* Type */
  --display-font: 'Space Grotesk', system-ui, sans-serif;
  --sans-font:    'Inter', system-ui, -apple-system, sans-serif;
  --mono-font:    'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;

  /* Radii */
  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 10px;
  --r-card: 14px;
  --r-card-lg: 18px;
  --r-hero: 22px;
  --r-pill: 999px;

  /* Shadows — more graphical, less soft */
  --shadow-card:  0 1px 0 rgba(255,255,255,0.6) inset,
                  0 8px 22px -14px rgba(20,19,14,0.20);
  --shadow-soft:  0 18px 38px -22px rgba(20,19,14,0.24);
  --shadow-pop:   0 24px 50px -26px rgba(20,19,14,0.30),
                  0 2px 6px rgba(20,19,14,0.07);

  /* Accent role */
  --accent:           var(--amber);
  --accent-deep:      var(--amber-deep);
  --accent-soft:      var(--amber-soft);
  --on-accent:        var(--carbon);
  --inverted-bg:      var(--carbon);
  --inverted-bg-deep: #050402;
  --inverted-fg:      #FFFFFF;
}

/* ============================================================
   Documentation page chrome — neutral, NOT product-scoped
   ============================================================ */
:root {
  --doc-bg:       #0F0F0E;
  --doc-bg-2:     #16161A;
  --doc-bg-3:     #1D1D22;
  --doc-line:     #2A2A2F;
  --doc-line-2:   #3A3A40;
  --doc-fg:       #E8E5DE;
  --doc-fg-2:     #B2AFA8;
  --doc-fg-3:     #807D77;
  --doc-accent:   #E4D9B8;

  --doc-mono:    'JetBrains Mono', ui-monospace, monospace;
  --doc-sans:    'Inter', system-ui, sans-serif;
}


/* ===== ds/primitives.css ===== */
/* ============================================================
   Arconique Design System — primitives
   Buttons, cards, badges, chips, KPI, pulse, type utilities.
   Lives under [data-product=…]; the documentation chrome
   (sections.css) provides the outer surface.
   ============================================================ */

/* ---------- Type utilities ---------- */
[data-product] .display {
  font-family: var(--display-font);
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1.02;
  color: var(--ink);
}
[data-product="development"] .display {
  font-weight: 500;
  letter-spacing: -0.025em;
}
[data-product] .display em {
  font-style: italic;
  color: var(--accent);
  font-weight: 400;
}

[data-product] .label {
  font-family: var(--mono-font);
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--ink-3);
  font-weight: 400;
}
[data-product="development"] .label,
[data-product="owner"] .label { letter-spacing: 0.18em; }

[data-product] .mono {
  font-family: var(--mono-font);
  font-feature-settings: "tnum";
}
[data-product] .num {
  font-family: var(--mono-font);
  font-feature-settings: "tnum";
  font-variant-numeric: tabular-nums;
}

[data-product] .body {
  font-family: var(--sans-font);
  color: var(--ink-2);
  line-height: 1.5;
}

/* ---------- Buttons ---------- */
[data-product] .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: var(--r-pill);
  font-family: var(--sans-font);
  font-size: 14px;
  font-weight: 500;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.18s ease, color 0.18s ease,
              border-color 0.18s ease, transform 0.18s ease;
  white-space: nowrap;
  text-decoration: none;
}
[data-product] .btn-lg { padding: 14px 22px; font-size: 15px; }
[data-product] .btn-sm { padding: 7px 14px; font-size: 13px; }
[data-product] .btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* Primary — uses inverted bg per product */
[data-product] .btn-primary { background: var(--ink); color: var(--inverted-fg); }
[data-product="management"] .btn-primary:hover,
[data-product="owner"] .btn-primary:hover { background: var(--forest); }
[data-product="development"] .btn-primary:hover { background: #25241D; }

/* Accent — terra (Mgmt/Owner), amber (Dev) */
[data-product] .btn-accent { background: var(--accent); color: var(--on-accent); }
[data-product] .btn-accent:hover { background: var(--accent-deep); }

/* Secondary — light card with border */
[data-product="management"] .btn-secondary,
[data-product="owner"] .btn-secondary {
  background: var(--cream-warm); color: var(--ink); border-color: var(--line);
}
[data-product="management"] .btn-secondary:hover,
[data-product="owner"] .btn-secondary:hover { background: var(--paper); border-color: var(--ink-2); }
[data-product="development"] .btn-secondary {
  background: var(--bg-3); color: var(--ink); border-color: var(--line-2);
}
[data-product="development"] .btn-secondary:hover { background: var(--bg-2); border-color: var(--line-3); }

/* Ghost */
[data-product] .btn-ghost { background: transparent; color: var(--ink-2); }
[data-product="management"] .btn-ghost:hover,
[data-product="owner"] .btn-ghost:hover { background: var(--cream-deep); color: var(--ink); }
[data-product="development"] .btn-ghost:hover { background: var(--bg-2); color: var(--ink); }

/* Danger */
[data-product] .btn-danger { background: var(--danger); color: var(--cream-warm); }
[data-product] .btn-danger:hover { filter: brightness(0.92); }

/* Round arrow / sticker buttons */
[data-product] .ra-btn {
  width: 46px; height: 46px; border-radius: var(--r-pill);
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; cursor: pointer; transition: transform 0.15s ease, background 0.18s ease;
  background: var(--ink); color: var(--inverted-fg);
}
[data-product] .ra-btn:hover { transform: translateX(2px); }
[data-product] .ra-btn.light {
  background: var(--paper); color: var(--ink); border: 1px solid var(--line);
}
[data-product] .ra-btn.accent { background: var(--accent); color: var(--on-accent); }

/* ---------- Cards ---------- */
[data-product="management"] .card,
[data-product="owner"] .card {
  background: var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-card);
}
[data-product="development"] .card,
[data-product="development"] .panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-card-lg);
}
[data-product] .card-lg { border-radius: var(--r-card-lg); }
[data-product] .card-hero { border-radius: var(--r-hero); }
[data-product] .card-pad { padding: 20px; }
[data-product] .card-pad-lg { padding: 28px; }

/* Inverted hero band */
[data-product] .card-inverted {
  background: var(--inverted-bg);
  color: var(--inverted-fg);
  border-color: var(--inverted-bg);
}
[data-product] .card-inverted .label { color: rgba(255,255,255,0.55); }

/* ---------- Badges ---------- */
[data-product] .badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  font-size: 11px;
  font-family: var(--mono-font);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border: 1px solid var(--line);
  color: var(--ink-2);
  background: var(--paper);
}
[data-product] .badge-ok     { background: color-mix(in oklab, var(--ok) 12%, transparent); color: var(--ok); border-color: color-mix(in oklab, var(--ok) 35%, transparent); }
[data-product] .badge-warn   { background: color-mix(in oklab, var(--warn) 12%, transparent); color: var(--warn); border-color: color-mix(in oklab, var(--warn) 35%, transparent); }
[data-product] .badge-danger { background: color-mix(in oklab, var(--danger) 12%, transparent); color: var(--danger); border-color: color-mix(in oklab, var(--danger) 35%, transparent); }
[data-product] .badge-info   { background: color-mix(in oklab, var(--info) 12%, transparent); color: var(--info); border-color: color-mix(in oklab, var(--info) 35%, transparent); }
[data-product] .badge-accent { background: color-mix(in oklab, var(--accent) 14%, transparent); color: var(--accent); border-color: color-mix(in oklab, var(--accent) 35%, transparent); }
[data-product="management"] .badge-gold,
[data-product="owner"] .badge-gold { background: rgba(188,154,92,0.15); color: #8c6f33; border-color: rgba(188,154,92,0.35); }
[data-product] .badge-ink {
  background: var(--ink); color: var(--inverted-fg); border-color: var(--ink);
}
[data-product] .badge-soft {
  background: var(--cream-warm, var(--bg-2)); color: var(--ink-2); border-color: var(--line-soft, var(--line-2));
}

/* ---------- Chips ---------- */
[data-product] .chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 13px;
  border-radius: var(--r-pill);
  font-family: var(--sans-font);
  font-size: 12.5px;
  color: var(--ink-2);
  border: 1px solid var(--line);
  background: var(--paper);
}
[data-product="development"] .chip { background: var(--bg-2); border-color: var(--line-2); }
[data-product] .chip-dot::before {
  content: ""; width: 7px; height: 7px; border-radius: 999px;
  background: var(--accent); display: inline-block;
}
[data-product] .chip-ink { background: var(--ink); color: var(--inverted-fg); border-color: var(--ink); }
[data-product] .chip-active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ---------- Pulse dot ---------- */
[data-product] .pulse-dot {
  width: 7px; height: 7px; border-radius: 999px; display: inline-block;
  background: var(--ok);
  animation: ds-pulse 2.4s ease-in-out infinite;
}
[data-product] .pulse-dot.accent { background: var(--accent); color: var(--accent); }
@keyframes ds-pulse {
  0%, 100% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
  50%      { box-shadow: 0 0 0 6px transparent; opacity: 0.55; }
}

/* ---------- Avatar ---------- */
[data-product] .avatar {
  width: 32px; height: 32px; border-radius: var(--r-pill);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--inverted-fg);
  font-family: var(--sans-font);
  font-size: 11px; font-weight: 500;
  background: linear-gradient(135deg, var(--gold-soft, var(--amber-soft)), var(--accent));
}
[data-product] .avatar-lg { width: 44px; height: 44px; font-size: 14px; }
[data-product] .avatar-sm { width: 24px; height: 24px; font-size: 10px; }

/* ---------- KPI tile ---------- */
[data-product] .kpi {
  padding: 16px 18px;
  border-radius: 14px;
  border: 1px solid var(--line-soft, var(--line));
  background: var(--paper, var(--panel));
}
[data-product] .kpi .label { font-size: 10.5px; }
[data-product] .kpi .v {
  font-family: var(--mono-font);
  font-feature-settings: "tnum";
  font-variant-numeric: tabular-nums;
  font-size: 26px;
  margin-top: 4px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.05;
}
[data-product] .kpi .sub {
  margin-top: 3px;
  font-family: var(--sans-font);
  font-size: 12px;
  color: var(--ink-3);
}
[data-product] .kpi.accent .v { color: var(--accent); }
[data-product] .kpi.ok .v { color: var(--ok); }
[data-product] .kpi.warn .v { color: var(--warn); }
[data-product] .kpi.gold .v { color: var(--gold, var(--amber)); }
[data-product] .kpi-lg .v { font-size: 36px; }
[data-product] .kpi-lg { padding: 22px 22px; }

/* Owner has a calmer, bigger KPI variant for statement clarity */
[data-product="owner"] .kpi-narrative {
  padding: 28px 28px;
  border-radius: var(--r-card-lg);
}
[data-product="owner"] .kpi-narrative .label { font-size: 11px; }
[data-product="owner"] .kpi-narrative .v {
  font-family: var(--display-font);
  font-feature-settings: normal;
  font-variant-numeric: tabular-nums;
  font-size: 44px;
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1;
  margin-top: 10px;
}
[data-product="owner"] .kpi-narrative .sub {
  margin-top: 8px;
  font-size: 13px;
}

/* ---------- Section heading ---------- */
[data-product] .section-heading { margin-bottom: 22px; }
[data-product] .section-heading .eyebrow { margin-bottom: 8px; }
[data-product] .section-heading h2,
[data-product] .section-heading h1 {
  margin: 0;
  font-family: var(--display-font);
  font-weight: 400;
  font-size: 38px;
  letter-spacing: -0.02em;
  line-height: 1.05;
  color: var(--ink);
}
[data-product="development"] .section-heading h2,
[data-product="development"] .section-heading h1 { font-weight: 500; letter-spacing: -0.025em; }
[data-product] .section-heading p {
  margin: 10px 0 0;
  color: var(--ink-3);
  font-size: 15px;
  max-width: 680px;
  line-height: 1.55;
}
[data-product="owner"] .section-heading h2,
[data-product="owner"] .section-heading h1 { font-size: 44px; }
[data-product="owner"] .section-heading p { font-size: 16px; }

/* ---------- Page header (with breadcrumbs) ---------- */
[data-product] .page-header {
  display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--line-soft, var(--line));
  margin-bottom: 22px;
}
[data-product] .page-header .left { flex: 1; min-width: 0; }
[data-product] .page-header .crumb {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono-font);
  font-size: 11.5px;
  color: var(--ink-3);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
}
[data-product] .page-header .crumb a { color: var(--ink-3); text-decoration: none; }
[data-product] .page-header .crumb a:hover { color: var(--ink); }
[data-product] .page-header h1 {
  margin: 0;
  font-family: var(--display-font);
  font-weight: 400;
  font-size: 34px;
  letter-spacing: -0.02em;
  line-height: 1.05;
  color: var(--ink);
}
[data-product="development"] .page-header h1 { font-weight: 500; }
[data-product] .page-header .actions {
  display: flex; gap: 8px; flex-wrap: wrap;
}


/* ===== ds/layout.css ===== */
/* ============================================================
   Arconique Design System — layout (sidebar, topbar, tables)
   ============================================================ */

/* ---------- App shell wrapper used in previews ---------- */
[data-product] .app-shell {
  display: grid;
  grid-template-columns: 264px 1fr;
  height: 580px;
  border: 1px solid var(--line);
  border-radius: var(--r-card-lg);
  overflow: hidden;
  background: var(--cream, var(--bg));
}
[data-product] .app-shell .shell-content {
  display: flex; flex-direction: column;
  min-width: 0;
  background: var(--cream, var(--bg));
}
[data-product] .app-shell .shell-body {
  padding: 22px 28px;
  overflow: auto;
  flex: 1;
}

/* ---------- Sidebar ---------- */
[data-product] .sidebar {
  border-right: 1px solid var(--line-soft, var(--line));
  display: flex; flex-direction: column;
  background: var(--paper, var(--panel));
  overflow-y: auto;
}
[data-product] .sidebar::-webkit-scrollbar { width: 6px; }
[data-product] .sidebar::-webkit-scrollbar-thumb {
  background: var(--line); border-radius: 999px;
}
[data-product] .sb-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 18px 14px;
  text-decoration: none; color: var(--ink);
}
[data-product] .sb-brand .logo {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--inverted-bg);
}
[data-product] .sb-brand .wordmark {
  font-family: var(--display-font);
  font-size: 20px;
  color: var(--ink);
}
[data-product] .sb-workspace {
  margin: 0 18px 12px;
  padding: 10px 12px;
  background: var(--cream-deep, var(--bg-2));
  border-radius: 10px;
}
[data-product] .sb-workspace .label { font-size: 9.5px; }
[data-product] .sb-workspace .name {
  font-family: var(--display-font);
  font-size: 16px;
  margin-top: 2px;
  color: var(--ink);
}
[data-product] .sb-workspace .sub {
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 2px;
}
[data-product] .sb-group {
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft, var(--line));
}
[data-product] .sb-group:last-child { border-bottom: 0; }
[data-product] .sb-group-title {
  font-family: var(--mono-font);
  text-transform: uppercase;
  font-size: 9.5px;
  letter-spacing: 0.18em;
  color: var(--ink-4);
  padding: 10px 18px 6px;
  display: flex; align-items: center; gap: 6px;
}
[data-product] .sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 18px;
  font-family: var(--sans-font);
  font-size: 13.5px;
  color: var(--ink-2);
  cursor: pointer; border: 0; background: transparent;
  width: 100%; text-align: left;
  border-left: 2px solid transparent;
  transition: background 0.12s ease, color 0.12s ease;
  text-decoration: none;
}
[data-product="management"] .sb-item:hover,
[data-product="owner"] .sb-item:hover { background: var(--cream-warm); }
[data-product="development"] .sb-item:hover { background: var(--bg-2); }
[data-product] .sb-item.on {
  color: var(--ink);
  font-weight: 500;
}
[data-product="management"] .sb-item.on,
[data-product="owner"] .sb-item.on {
  background: var(--cream-warm);
  border-left-color: var(--accent);
}
[data-product="development"] .sb-item.on {
  background: var(--bg-2);
  border-left-color: var(--accent);
}
[data-product] .sb-badge {
  margin-left: auto;
  font-family: var(--mono-font);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--cream-deep, var(--bg-3));
  color: var(--ink-3);
}
[data-product] .sb-item.on .sb-badge {
  background: var(--accent);
  color: var(--on-accent);
}

/* ---------- Topbar ---------- */
[data-product] .topbar {
  position: sticky; top: 0; z-index: 30;
  padding: 12px 28px;
  display: flex; align-items: center; gap: 16px;
  border-bottom: 1px solid var(--line-soft, var(--line));
  backdrop-filter: blur(10px);
  background: color-mix(in srgb, var(--cream, var(--bg)) 92%, transparent);
}
[data-product] .tb-crumb {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono-font);
  font-size: 12.5px;
  color: var(--ink-3);
}
[data-product] .tb-crumb b { color: var(--ink); font-weight: 500; }
[data-product] .tb-spacer { flex: 1; }
[data-product] .tb-search {
  position: relative;
  width: 280px;
}
[data-product] .tb-search input {
  width: 100%;
  padding: 7px 38px 7px 32px;
  border: 1px solid var(--line);
  border-radius: 999px;
  outline: none;
  font-family: var(--sans-font);
  font-size: 13px;
  color: var(--ink);
  background: var(--paper, var(--panel));
}
[data-product] .tb-search .sx {
  position: absolute; left: 10px; top: 8px;
  color: var(--ink-4);
}
[data-product] .tb-search .kbd {
  position: absolute; right: 8px; top: 6px;
  font-family: var(--mono-font);
  font-size: 10px;
  padding: 1px 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink-3);
}
[data-product] .tb-bell {
  position: relative;
  width: 32px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-2);
  border-radius: 999px;
  cursor: pointer;
  background: transparent;
  border: 0;
}
[data-product] .tb-bell:hover { background: var(--cream-deep, var(--bg-2)); }
[data-product] .tb-bell .dot {
  position: absolute;
  top: 6px; right: 6px;
  width: 7px; height: 7px; border-radius: 999px;
  background: var(--accent);
}
[data-product] .tb-user {
  display: flex; align-items: center; gap: 8px;
  padding-left: 12px;
  border-left: 1px solid var(--line);
}
[data-product] .tb-user .meta {
  display: flex; flex-direction: column;
  line-height: 1.15;
}
[data-product] .tb-user .name { font-size: 13px; font-weight: 500; color: var(--ink); }
[data-product] .tb-user .role { font-size: 10.5px; color: var(--ink-3); }

/* ---------- Tables ---------- */
[data-product] table.data {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--sans-font);
  font-size: 13px;
}
[data-product] table.data th,
[data-product] table.data td {
  padding: 10px 14px;
  text-align: left;
  vertical-align: middle;
  border-bottom: 1px solid var(--line-soft, var(--line));
}
[data-product] table.data th {
  font-family: var(--mono-font);
  font-size: 10.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-3);
}
[data-product="management"] table.data th,
[data-product="owner"] table.data th {
  background: var(--cream);
  border-bottom-color: var(--line-soft);
}
[data-product="development"] table.data th {
  background: var(--bg-2);
  border-bottom-color: var(--line-2);
}
[data-product] table.data tbody tr:hover {
  background: color-mix(in srgb, var(--cream-warm, var(--bg-2)) 60%, transparent);
}
[data-product] table.data td.num,
[data-product] table.data th.num {
  text-align: right;
  font-family: var(--mono-font);
  font-variant-numeric: tabular-nums;
}
[data-product] table.data .row-title {
  font-family: var(--display-font);
  font-size: 14.5px;
  color: var(--ink);
}

/* Mgmt-soft variant: airier rows, serif row titles */
[data-product="management"] table.guests,
[data-product="owner"] table.guests {
  width: 100%; border-collapse: collapse;
  font-family: var(--sans-font);
}
[data-product="management"] table.guests th,
[data-product="management"] table.guests td,
[data-product="owner"] table.guests th,
[data-product="owner"] table.guests td {
  padding: 14px 18px;
  text-align: left;
  font-size: 14px;
  vertical-align: middle;
  border-bottom: 1px solid var(--line-soft);
}
[data-product="management"] table.guests th,
[data-product="owner"] table.guests th {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-weight: 500;
  color: var(--ink-3);
  background: var(--cream);
}
[data-product="owner"] table.guests th,
[data-product="owner"] table.guests td { padding: 18px 22px; }
[data-product="management"] table.guests tbody tr:hover,
[data-product="owner"] table.guests tbody tr:hover { background: var(--cream); }

/* ---------- Forms ---------- */
[data-product] .field { display: flex; flex-direction: column; gap: 6px; }
[data-product] .field-label {
  font-family: var(--mono-font);
  text-transform: uppercase;
  font-size: 10.5px;
  letter-spacing: 0.16em;
  color: var(--ink-3);
}
[data-product] .input,
[data-product] .select,
[data-product] .textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper, var(--panel));
  font-family: var(--sans-font);
  font-size: 14px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
[data-product] .textarea { min-height: 96px; resize: vertical; }
[data-product] .input:focus,
[data-product] .select:focus,
[data-product] .textarea:focus {
  border-color: var(--ink-2);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent);
}
[data-product] .input::placeholder,
[data-product] .textarea::placeholder { color: var(--ink-4); }
[data-product] .field-help { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
[data-product] .field-error { font-size: 12px; color: var(--danger); margin-top: 2px; }

[data-product] .check {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--sans-font); font-size: 14px; color: var(--ink);
  cursor: pointer;
}
[data-product] .check input { appearance: none; -webkit-appearance: none; }
[data-product] .check .box {
  width: 18px; height: 18px;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background: var(--paper, var(--panel));
  display: inline-flex; align-items: center; justify-content: center;
  transition: background 0.18s ease, border-color 0.18s ease;
}
[data-product] .check input:checked + .box {
  background: var(--ink); border-color: var(--ink);
}
[data-product] .check input:checked + .box::after {
  content: "";
  width: 9px; height: 5px;
  border-left: 2px solid var(--inverted-fg);
  border-bottom: 2px solid var(--inverted-fg);
  transform: rotate(-45deg) translate(0, -2px);
}

[data-product] .radio .box { border-radius: 999px; }
[data-product] .radio input:checked + .box {
  background: var(--paper, var(--panel));
  border-color: var(--accent);
}
[data-product] .radio input:checked + .box::after {
  content: ""; width: 9px; height: 9px;
  border: 0; transform: none; background: var(--accent);
  border-radius: 999px;
}

[data-product] .toggle {
  position: relative; width: 38px; height: 22px;
  background: var(--line);
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.18s ease;
}
[data-product] .toggle::after {
  content: ""; position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  background: var(--paper, var(--panel));
  border-radius: 999px;
  transition: transform 0.18s ease;
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
[data-product] .toggle.on { background: var(--accent); }
[data-product] .toggle.on::after { transform: translateX(16px); }

/* ---------- Filter bar ---------- */
[data-product] .filter-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--paper, var(--panel));
  margin-bottom: 14px;
}
[data-product] .filter-bar .divider {
  width: 1px; height: 22px; background: var(--line); margin: 0 2px;
}

/* ---------- Empty state ---------- */
[data-product] .empty {
  padding: 40px 28px;
  border: 1px dashed var(--line);
  border-radius: var(--r-card);
  background: color-mix(in srgb, var(--cream-warm, var(--bg-2)) 50%, transparent);
  text-align: center;
}
[data-product] .empty .glyph {
  width: 44px; height: 44px; margin: 0 auto 14px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-3);
  background: var(--cream-deep, var(--bg-3));
  border-radius: 999px;
}
[data-product] .empty .title {
  font-family: var(--display-font);
  font-size: 18px;
  color: var(--ink);
  margin: 0 0 6px;
}
[data-product] .empty .copy {
  font-size: 13px;
  color: var(--ink-3);
  max-width: 360px;
  margin: 0 auto 14px;
  line-height: 1.5;
}

/* ---------- Pagination ---------- */
[data-product] .pagination {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono-font);
  font-size: 12px;
}
[data-product] .pagination button {
  min-width: 30px; height: 30px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper, var(--panel));
  font-family: inherit;
  font-size: inherit;
  color: var(--ink-2);
  cursor: pointer;
}
[data-product] .pagination button:hover { border-color: var(--ink-2); color: var(--ink); }
[data-product] .pagination button.on {
  background: var(--ink); color: var(--inverted-fg); border-color: var(--ink);
}
[data-product] .pagination .meta {
  margin-left: 12px; color: var(--ink-3);
}

/* ---------- Modal ---------- */
[data-product] .modal-backdrop {
  position: relative;
  background: color-mix(in srgb, var(--ink) 35%, transparent);
  padding: 36px 28px;
  border-radius: var(--r-card);
  display: flex; align-items: flex-start; justify-content: center;
}
[data-product] .modal {
  width: 480px; max-width: 100%;
  background: var(--paper, var(--panel));
  border-radius: var(--r-card-lg);
  border: 1px solid var(--line);
  overflow: hidden;
  box-shadow: var(--shadow-pop);
}
[data-product] .modal-header {
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--line-soft, var(--line));
  display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
}
[data-product] .modal-header h3 {
  margin: 0;
  font-family: var(--display-font); font-weight: 400; font-size: 19px;
  color: var(--ink);
}
[data-product] .modal-header p { margin: 4px 0 0; font-size: 13px; color: var(--ink-3); }
[data-product] .modal-body { padding: 18px 22px; }
[data-product] .modal-footer {
  padding: 14px 22px;
  border-top: 1px solid var(--line-soft, var(--line));
  background: var(--cream-warm, var(--bg-2));
  display: flex; gap: 8px; justify-content: flex-end;
}

/* ---------- Command palette preview ---------- */
[data-product] .cmdk {
  width: 540px; max-width: 100%;
  background: var(--paper, var(--panel));
  border: 1px solid var(--line);
  border-radius: var(--r-card-lg);
  box-shadow: var(--shadow-pop);
  overflow: hidden;
}
[data-product] .cmdk-input {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-soft, var(--line));
  font-family: var(--sans-font);
  font-size: 15px;
  color: var(--ink-2);
  display: flex; align-items: center; gap: 10px;
}
[data-product] .cmdk-input .sx { color: var(--ink-4); }
[data-product] .cmdk-group {
  padding: 6px 0;
  border-bottom: 1px solid var(--line-soft, var(--line));
}
[data-product] .cmdk-group:last-child { border-bottom: 0; }
[data-product] .cmdk-group-title {
  font-family: var(--mono-font);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--ink-4);
  padding: 8px 18px 4px;
}
[data-product] .cmdk-item {
  padding: 8px 18px;
  display: flex; align-items: center; gap: 10px;
  font-family: var(--sans-font); font-size: 13.5px;
  color: var(--ink-2);
  cursor: pointer;
}
[data-product] .cmdk-item.on,
[data-product] .cmdk-item:hover { background: var(--cream-warm, var(--bg-2)); color: var(--ink); }
[data-product] .cmdk-item .hint {
  margin-left: auto;
  font-family: var(--mono-font);
  font-size: 10.5px;
  color: var(--ink-4);
}

/* ---------- Detail page skeleton ---------- */
[data-product] .detail-shell {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 18px;
}
[data-product] .detail-shell .related { display: flex; flex-direction: column; gap: 14px; }
[data-product] .detail-tabs {
  display: flex; align-items: center; gap: 4px;
  border-bottom: 1px solid var(--line-soft, var(--line));
  margin-bottom: 18px;
}
[data-product] .detail-tabs .tab {
  padding: 10px 14px;
  border: 0; background: transparent;
  font-family: var(--sans-font);
  font-size: 13.5px; color: var(--ink-3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
[data-product] .detail-tabs .tab.on {
  color: var(--ink);
  border-bottom-color: var(--accent);
}

/* ---------- Mobile preview frame ---------- */
.mobile-frame {
  width: 360px;
  border: 1px solid var(--line, #DAD2C0);
  border-radius: 24px;
  overflow: hidden;
  background: var(--cream, var(--bg, #F4EFE6));
  box-shadow: 0 16px 40px -18px rgba(15,15,14,0.22),
              0 2px 6px rgba(15,15,14,0.06);
  height: 640px;
  display: flex; flex-direction: column;
}
.mobile-frame .mobile-status {
  height: 28px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  font-family: var(--mono-font, monospace);
  font-size: 11px;
  color: var(--ink, #14201C);
}
.mobile-frame .mobile-body {
  flex: 1;
  overflow: auto;
}

/* Mobile tabbar */
[data-product] .mobile-tabbar {
  display: flex; align-items: stretch;
  border-top: 1px solid var(--line);
  background: var(--paper, var(--panel));
}
[data-product] .mobile-tabbar .tb {
  flex: 1;
  padding: 8px 0 10px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-family: var(--mono-font);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  cursor: pointer;
  border: 0; background: transparent;
}
[data-product] .mobile-tabbar .tb.on {
  color: var(--ink);
}
[data-product] .mobile-tabbar .tb.on .ico {
  color: var(--accent);
}
[data-product] .mobile-tabbar .ico {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
}


/* ===== ds/meta.css ===== */
/* ============================================================
   Documentation page chrome — neutral surface that hosts
   the product previews. NOT product-scoped.
   ============================================================ */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--doc-sans);
  background: var(--doc-bg);
  color: var(--doc-fg);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "cv11";
  min-height: 100vh;
}

/* ---------- App layout ---------- */
.ds-app {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: 100vh;
}

/* ---------- Left rail (TOC) ---------- */
.ds-toc {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  border-right: 1px solid var(--doc-line);
  padding: 24px 16px 32px;
  background: var(--doc-bg-2);
}
.ds-toc .ds-mark {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--doc-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--doc-fg-3);
  padding: 4px 8px 16px;
}
.ds-toc .ds-mark .glyph {
  width: 6px; height: 6px;
  background: var(--doc-accent);
  border-radius: 2px;
  display: inline-block;
}
.ds-toc h1 {
  font-family: var(--doc-sans);
  font-weight: 500;
  font-size: 16px;
  margin: 0 0 22px;
  padding: 0 8px;
  color: var(--doc-fg);
  letter-spacing: -0.005em;
}
.ds-toc .ds-toc-group {
  display: flex; flex-direction: column; gap: 2px;
  margin-bottom: 18px;
}
.ds-toc .ds-toc-group-title {
  font-family: var(--doc-mono);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--doc-fg-3);
  padding: 8px 8px 6px;
}
.ds-toc .ds-toc-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 8px;
  font-size: 13px;
  color: var(--doc-fg-2);
  text-decoration: none;
  border-radius: 6px;
  border-left: 2px solid transparent;
  padding-left: 10px;
}
.ds-toc .ds-toc-item:hover {
  background: var(--doc-bg-3);
  color: var(--doc-fg);
}
.ds-toc .ds-toc-item.on {
  background: var(--doc-bg-3);
  color: var(--doc-fg);
  border-left-color: var(--doc-accent);
}
.ds-toc .ds-toc-item .num {
  font-family: var(--doc-mono);
  font-size: 10px;
  color: var(--doc-fg-3);
  width: 18px;
}

/* ---------- Right side ---------- */
.ds-main {
  display: flex; flex-direction: column;
  min-width: 0;
  background: var(--doc-bg);
}

/* ---------- Product tab bar ---------- */
.ds-tabs {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex; align-items: center; gap: 0;
  border-bottom: 1px solid var(--doc-line);
  background: var(--doc-bg);
  padding: 0 32px;
}
.ds-tab {
  padding: 18px 18px;
  font-family: var(--doc-sans);
  font-size: 13px;
  color: var(--doc-fg-2);
  border: 0; background: transparent;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: flex; align-items: center; gap: 10px;
}
.ds-tab:hover { color: var(--doc-fg); }
.ds-tab.on {
  color: var(--doc-fg);
  border-bottom-color: var(--doc-accent);
}
.ds-tab .swatch {
  width: 10px; height: 10px;
  border-radius: 999px;
  background: var(--swatch);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
}
.ds-tab .tag {
  font-family: var(--doc-mono);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--doc-fg-3);
  margin-left: 6px;
}
.ds-tab.on .tag { color: var(--doc-fg-2); }
.ds-tabs .ds-meta {
  margin-left: auto;
  display: flex; align-items: center; gap: 14px;
  padding: 12px 4px;
  font-family: var(--doc-mono);
  font-size: 11px;
  color: var(--doc-fg-3);
}
.ds-tabs .ds-meta .pill {
  padding: 4px 10px;
  border: 1px solid var(--doc-line-2);
  border-radius: 999px;
  color: var(--doc-fg-2);
}

/* ---------- Content area ---------- */
.ds-content {
  padding: 0 32px 96px;
}

/* ---------- Section ---------- */
.ds-section {
  padding: 56px 0 24px;
  border-bottom: 1px solid var(--doc-line);
}
.ds-section:last-child { border-bottom: 0; }
.ds-section-head {
  display: flex; align-items: flex-end; gap: 18px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.ds-section-head .ds-section-eyebrow {
  font-family: var(--doc-mono);
  font-size: 11px;

<script type="text/babel">
/* Auth prototype — screen components. Exposed on window for app.jsx. */
const { useState } = React;

/* ---------- tiny inline icon set ---------- */
function Ico({ d, size = 16, sw = 1.7, fill }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill || "none"}
      stroke={fill ? "none" : "currentColor"} strokeWidth={sw}
      strokeLinecap="round" strokeLinejoin="round">{d}</svg>
  );
}
const IconArrow = (p) => <Ico {...p} d={<><path d="M5 12h14" /><path d="M13 6l6 6-6 6" /></>} />;
const IconMail = (p) => <Ico {...p} d={<><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 6 9-6" /></>} />;
const IconLock = (p) => <Ico {...p} d={<><rect x="4" y="11" width="16" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></>} />;
const IconShield = (p) => <Ico {...p} d={<><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z" /><path d="M9.5 12l1.8 1.8L15 10" /></>} />;
const IconUp = (p) => <Ico {...p} d={<><path d="M7 17L17 7" /><path d="M8 7h9v9" /></>} />;
const IconCheck = (p) => <Ico {...p} d={<path d="M5 12.5l4.5 4.5L19 7" />} />;
const IconBack = (p) => <Ico {...p} d={<><path d="M19 12H5" /><path d="M11 6l-6 6 6 6" /></>} />;
const IconKey = (p) => <Ico {...p} d={<><circle cx="8" cy="15" r="4" /><path d="M11 12l8-8" /><path d="M17 6l2 2" /><path d="M15 8l2 2" /></>} />;

/* ---------- brand mark (geometric roofline) ---------- */
function BrandMark({ size = 26, color }) {
  return (
    <svg width={size} height={size} viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M16 4 L28 14 H24 L16 8 L8 14 H4 Z" fill={color} />
      <path d="M16 13 L25 20 H21.5 L16 16 L10.5 20 H7 Z" fill={color} opacity="0.62" />
      <path d="M16 21 L22 25.5 H10 Z" fill={color} opacity="0.34" />
    </svg>
  );
}

function Logo({ plat }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 11 }}>
      <BrandMark color="var(--accent)" />
      <div style={{ lineHeight: 1.1 }}>
        <div style={{ fontFamily: "var(--display-font)", fontSize: 20, color: "var(--ink)", letterSpacing: "-0.01em" }}>{plat.wordmark}</div>
        <div className="label" style={{ fontSize: 9.5, marginTop: 1 }}>{plat.wordmarkSub}</div>
      </div>
    </div>
  );
}

/* ---------- form atoms ---------- */
function Field({ label, icon, ...rest }) {
  return (
    <label className="field" style={{ gap: 7 }}>
      <span className="field-label">{label}</span>
      <div style={{ position: "relative" }}>
        {icon && <span style={{ position: "absolute", left: 13, top: "50%", transform: "translateY(-50%)", color: "var(--ink-4)", display: "inline-flex" }}>{icon}</span>}
        <input className="input" style={{ paddingLeft: icon ? 40 : 14, height: 46 }} {...rest} />
      </div>
    </label>
  );
}

function PrimaryBtn({ children, onClick }) {
  return (
    <button className="btn btn-accent btn-lg" onClick={onClick}
      style={{ width: "100%", justifyContent: "center", marginTop: 4, height: 48 }}>
      {children}
    </button>
  );
}

function TextLink({ children, onClick }) {
  return (
    <button onClick={onClick} style={{
      background: "none", border: 0, padding: 0, cursor: "pointer",
      fontFamily: "var(--sans-font)", fontSize: 13.5, color: "var(--ink-2)",
      textDecoration: "underline", textUnderlineOffset: 3, textDecorationColor: "var(--line-strong)",
    }}>{children}</button>
  );
}

/* ---------- right brand panel (tone-aware) ---------- */
function BrandPanel({ plat, tone }) {
  if (plat.dark) tone = tone === "editorial" ? "editorial" : "premium";
  const t = plat.testimonial;

  if (tone === "premium") {
    return (
      <div className="auth-panel" style={{ background: "var(--inverted-bg)", color: "var(--inverted-fg)" }}>
        <div className="auth-panel-glow" style={{ background: "radial-gradient(60% 55% at 100% 0%, color-mix(in oklab, var(--accent) 55%, transparent), transparent 65%)" }} />
        <div className="auth-panel-grid" />
        <div className="auth-panel-inner">
          <span className="label" style={{ color: "color-mix(in oklab, var(--inverted-fg) 60%, transparent)" }}>{plat.panelKicker}</span>
          {t ? (
            <>
              <p style={{ fontFamily: "var(--display-font)", fontSize: 30, lineHeight: 1.22, fontWeight: 400, color: "var(--inverted-fg)", margin: "18px 0 0", letterSpacing: "-0.015em" }}>“{t.quote}”</p>
              <p style={{ marginTop: 18, fontSize: 13.5, color: "color-mix(in oklab, var(--inverted-fg) 72%, transparent)" }}>— {t.who}</p>
            </>
          ) : <PlatformStat dark />}
        </div>

  }

  if (tone === "editorial") {
    return (
      <div className="auth-panel" style={{ background: "var(--cream-deep, var(--bg-2))" }}>

        <div className="auth-panel-inner" style={{ color: "#fff", position: "relative" }}>
          <span className="label" style={{ color: "rgba(255,255,255,0.78)" }}>{plat.panelKicker}</span>
          {t ? (
            <>
              <p style={{ fontFamily: "var(--display-font)", fontSize: 30, lineHeight: 1.22, fontWeight: 400, margin: "18px 0 0", letterSpacing: "-0.015em", textShadow: "0 2px 24px rgba(0,0,0,0.35)" }}>“{t.quote}”</p>
              <p style={{ marginTop: 18, fontSize: 13.5, color: "rgba(255,255,255,0.85)" }}>— {t.who}</p>
            </>
          ) : <PlatformStat />}
          <span className="auth-photo-tag">drop a villa photo here</span>
        </div>
      </div>

  // warm (default)
  return (
    <div className="auth-panel" style={{
      background: "radial-gradient(ellipse at top right, color-mix(in oklab, var(--accent) 22%, transparent), transparent 60%), linear-gradient(180deg, var(--cream-warm, var(--bg-2)), var(--cream, var(--bg)))",
    }}>
      <div className="auth-panel-inner">
        <span className="label">{plat.panelKicker}</span>
        {t ? (
          <>
            <p style={{ fontFamily: "var(--display-font)", fontSize: 30, lineHeight: 1.22, fontWeight: 400, color: "var(--ink)", margin: "18px 0 0", letterSpacing: "-0.015em" }}>“{t.quote}”</p>
            <p style={{ marginTop: 18, fontSize: 13.5, color: "var(--ink-3)" }}>— {t.who}</p>
          </>
        ) : <PlatformStat />}
      </div>
    </div>
  );
}

function PlatformStat({ dark }) {
  const fg = dark ? "var(--inverted-fg)" : "var(--ink)";
  const sub = dark ? "color-mix(in oklab, var(--inverted-fg) 65%, transparent)" : "var(--ink-3)";
  const rows = [["Organizations", "38"], ["Active agents", "112"], ["Uptime · 30d", "99.98%"]];
  return (
    <div style={{ marginTop: 22, display: "flex", flexDirection: "column", gap: 18 }}>
      {rows.map(([k, v]) => (
        <div key={k}>
          <div style={{ fontFamily: "var(--mono-font)", fontVariantNumeric: "tabular-nums", fontSize: 40, color: fg, lineHeight: 1 }}>{v}</div>
          <div className="label" style={{ marginTop: 6, color: sub }}>{k}</div>
        </div>
      ))}
    </div>
  );
}

/* ---------- shell ---------- */
function AuthShell({ plat, tone, footer, children }) {
  return (
    <div className="auth-shell" data-product={plat.dataProduct}>
      <div className="auth-form-col">
        <div className="auth-form-top"><Logo plat={plat} /></div>
        <div className="auth-form-mid">
          <div className="auth-form-box">{children}</div>
        </div>
        <div className="auth-form-foot">
          {footer || <span>© {new Date().getFullYear()} Arconique · {plat.domain}</span>}
        </div>
      </div>
      <BrandPanel plat={plat} tone={tone} />
    </div>

}

function Head({ plat, kicker, title }) {
  return (
    <>
      <span className="label" style={{ color: "var(--accent)" }}>{kicker || plat.badge}</span>
      <h1 style={{
        fontFamily: "var(--display-font)", fontWeight: plat.dataProduct === "development" ? 500 : 400,
        fontSize: plat.calm ? 52 : 46, lineHeight: 1.0, letterSpacing: "-0.025em",
        color: "var(--ink)", margin: "14px 0 0",
      }}>{title}</h1>
    </>

}

/* ===================== SCREENS ===================== */

function SignIn({ plat, tone, go }) {
  return (
    <AuthShell plat={plat} tone={tone}>
      <Head plat={plat} title={<>{plat.headline[0]}<em style={{ fontStyle: "italic", color: "var(--accent)" }}>{plat.headline[1]}</em></>} />
      <p className="body" style={{ marginTop: 12, fontSize: 15, color: "var(--ink-3)", maxWidth: 380 }}>{plat.sub}</p>

      <div style={{ marginTop: 28, display: "flex", flexDirection: "column", gap: 16 }}>
        <Field label="Work email" type="email" name="email" autoComplete="email" placeholder="you@company.com" icon={<IconMail />} />
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 7 }}>
            <span className="field-label">Password</span>
            <TextLink onClick={() => go("forgot")}>Forgot?</TextLink>
          </div>
          <div style={{ position: "relative" }}>
            <span style={{ position: "absolute", left: 13, top: "50%", transform: "translateY(-50%)", color: "var(--ink-4)" }}><IconLock /></span>

          </div>
        </div>
        <label className="check" style={{ fontSize: 13.5 }}>
          <input type="checkbox" defaultChecked /><span className="box"></span>

        </label>

      </div>
    </AuthShell>
  );
}

function SignUp({ plat, tone, go }) {
  return (
    <AuthShell plat={plat} tone={tone}>
      <Head plat={plat} kicker="Start free · 14 days" title={<>Start your <em style={{ fontStyle: "italic", color: "var(--accent)" }}>trial.</em></>} />
      <p className="body" style={{ marginTop: 12, fontSize: 15, color: "var(--ink-3)", maxWidth: 400 }}>Create your organization. No credit card required during the trial.</p>

      <div style={{ marginTop: 24, display: "flex", flexDirection: "column", gap: 14 }}>
        <div className="auth-2col">
          <Field label="Your name" placeholder="Jane Operator" />

        </div>
        <Field label="Password" type="password" placeholder="At least 8 characters" icon={<IconLock />} />
        <Field label="Organization name" placeholder="Acme Villas" />
        <label className="field" style={{ gap: 7 }}>
          <span className="field-label">Workspace</span>
          <div className="auth-slug">
            <input className="input" placeholder="acme" style={{ border: 0, height: 44, borderRadius: 0, background: "transparent", flex: 1 }} />
            <span className="auth-slug-suffix">.arconique.com</span>
          </div>
        </label>
        <label className="field" style={{ gap: 7 }}>
          <span className="field-label">Plan</span>
          <select className="select" style={{ height: 46 }}>
            <option>Standard — 14-day trial</option>
            <option>Pro — 14-day trial</option>
            <option>Enterprise — talk to sales</option>

        </label>
        <PrimaryBtn onClick={() => go("signin")}>Create workspace <IconArrow size={17} /></PrimaryBtn>
        <p style={{ fontSize: 12, color: "var(--ink-4)", lineHeight: 1.5, margin: 0 }}>

      <div className="auth-foot-row"><span>Already have an account? <TextLink onClick={() => go("signin")}>Sign in</TextLink></span></div>

function Forgot({ plat, tone, go }) {
  return (
    <AuthShell plat={plat} tone={tone}>
      <button className="auth-back" onClick={() => go("signin")}><IconBack size={15} /> Back to sign in</button>
      <Head plat={plat} kicker="Reset access" title={<>Forgot your <em style={{ fontStyle: "italic", color: "var(--accent)" }}>password?</em></>} />
      <p className="body" style={{ marginTop: 12, fontSize: 15, color: "var(--ink-3)", maxWidth: 380 }}>Enter your work email and we'll send a secure reset link. It expires in 30 minutes.</p>
      <div style={{ marginTop: 26, display: "flex", flexDirection: "column", gap: 16 }}>
        <Field label="Work email" type="email" placeholder="you@company.com" icon={<IconMail />} />
        <PrimaryBtn onClick={() => go("reset")}>Send reset link <IconArrow size={17} /></PrimaryBtn>
      </div>
      <div className="auth-foot-row"><span style={{ color: "var(--ink-4)" }}>Didn't get it? Check spam, or contact your administrator.</span></div>
    </AuthShell>

}

function Reset({ plat, tone, go }) {
  const reqs = ["At least 8 characters", "One number or symbol", "Not a previous password"];
  return (
    <AuthShell plat={plat} tone={tone}>
      <Head plat={plat} kicker="Reset access" title={<>Set a new <em style={{ fontStyle: "italic", color: "var(--accent)" }}>password.</em></>} />
      <p className="body" style={{ marginTop: 12, fontSize: 15, color: "var(--ink-3)", maxWidth: 380 }}>Choose a strong password you don't use anywhere else.</p>
      <div style={{ marginTop: 26, display: "flex", flexDirection: "column", gap: 16 }}>
        <Field label="New password" type="password" placeholder="••••••••" icon={<IconLock />} />

        <div className="auth-reqs">
          {reqs.map((r) => (
            <div key={r} className="auth-req"><span className="auth-req-dot"><IconCheck size={11} /></span>{r}</div>
          ))}
        </div>
        <PrimaryBtn onClick={() => go("signin")}>Update password <IconArrow size={17} /></PrimaryBtn>
      </div>
    </AuthShell>
  );
}

function MfaVerify({ plat, tone, go }) {
  const [vals, setVals] = useState(["", "", "", "", "", ""]);
  function setAt(i, v) {
    v = v.replace(/\D/g, "").slice(-1);
    const next = vals.slice(); next[i] = v; setVals(next);
    if (v && i < 5) { const el = document.getElementById("otp-" + (i + 1)); if (el) el.focus(); }
  }
  return (
    <AuthShell plat={plat} tone={tone}>
      <button className="auth-back" onClick={() => go("signin")}><IconBack size={15} /> Back to sign in</button>
      <Head plat={plat} kicker="Two-factor" title={<>Enter your <em style={{ fontStyle: "italic", color: "var(--accent)" }}>code.</em></>} />
      <p className="body" style={{ marginTop: 12, fontSize: 15, color: "var(--ink-3)", maxWidth: 380 }}>Open your authenticator app and enter the 6-digit code for {plat.wordmark}.</p>
      <div style={{ marginTop: 26 }}>
        <div className="auth-otp">
          {vals.map((v, i) => (
            <input key={i} id={"otp-" + i} className="auth-otp-cell" inputMode="numeric" maxLength={1}
              value={v} onChange={(e) => setAt(i, e.target.value)} />
          ))}
        </div>
        <PrimaryBtn onClick={() => go(null)}>Verify <IconArrow size={17} /></PrimaryBtn>
        <div style={{ display: "flex", gap: 18, marginTop: 16, fontSize: 13.5 }}>
          <TextLink>Resend code</TextLink>
          <TextLink>Use a recovery code</TextLink>
        </div>
      </div>
    </AuthShell>
  );
}

function AdminBootstrap({ plat, tone, go }) {
  return (
    <AuthShell plat={plat} tone={tone}>
      <Head plat={plat} kicker="First run · create owner" title={<>Claim this <em style={{ fontStyle: "italic", color: "var(--accent)" }}>workspace.</em></>} />
      <p className="body" style={{ marginTop: 12, fontSize: 15, color: "var(--ink-3)", maxWidth: 400 }}>No administrator exists yet. The first account becomes the system owner — with full access and audit responsibility.</p>
      <div className="auth-callout"><span className="auth-callout-ic"><IconKey size={15} /></span>This step is shown only once. Store the recovery codes you'll receive next.</div>
      <div style={{ marginTop: 20, display: "flex", flexDirection: "column", gap: 14 }}>
        <div className="auth-2col">
          <Field label="Full name" placeholder="Jane Operator" />
          <Field label="Work email" type="email" placeholder="you@company.com" icon={<IconMail />} />
        </div>
        <Field label="Password" type="password" placeholder="At least 12 characters" icon={<IconLock />} />
        <Field label="Confirm password" type="password" placeholder="••••••••" icon={<IconLock />} />
        <label className="check" style={{ fontSize: 13.5, alignItems: "flex-start" }}>
          <input type="checkbox" /><span className="box" style={{ marginTop: 1 }}></span>
          <span>I understand I'm the system owner and will enable two-factor immediately after setup.</span>
        </label>
        <PrimaryBtn onClick={() => go("mfa")}>Create owner account <IconArrow size={17} /></PrimaryBtn>
      </div>
    </AuthShell>
  );
}

const AUTH_SCREEN_COMPONENTS = {
  signin: SignIn, signup: SignUp, forgot: Forgot, reset: Reset, mfa: MfaVerify, bootstrap: AdminBootstrap,
};

Object.assign(window, { AuthShell, BrandPanel, Logo, AUTH_SCREEN_COMPONENTS });

</script>
<script type="text/babel">
/* Auth prototype — app shell, navigator, router. Loaded last. */
const { useState, useEffect } = React;

const SWATCH = {
  management: "#C4583C", owner: "#BC9A5C", development: "#FF6B35",
  investor: "#3D5A7A", buyer: "#E48A6E", platform: "#5B9DFF",
};

function Done({ plat, go }) {
  return (
    <div className="auth-done" data-product={plat.dataProduct}>
      <div className="auth-done-card">
        <div className="auth-done-ring">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12.5l4.5 4.5L19 7" /></svg>
        </div>
        <h1 style={{ fontFamily: "var(--display-font)", fontWeight: 400, fontSize: 32, color: "var(--ink)", margin: 0, letterSpacing: "-0.02em" }}>You're in.</h1>
        <p className="body" style={{ marginTop: 10, color: "var(--ink-3)", fontSize: 15 }}>Signed in to {plat.label}. Redirecting to your workspace…</p>
        <button className="btn btn-secondary" style={{ marginTop: 22 }} onClick={() => go("signin")}>Back to sign in</button>
      </div>
    </div>
  );
}

function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem("arc-auth") || "{}"); } catch (e) { return {}; } })();
  const [platform, setPlatform] = useState(saved.platform || "management");
  const [screen, setScreen] = useState(saved.screen || "signin");
  const [tone, setTone] = useState(saved.tone || "warm");

  useEffect(() => {
    localStorage.setItem("arc-auth", JSON.stringify({ platform, screen, tone }));
  }, [platform, screen, tone]);

  const plat = AUTH_PLATFORMS[platform];
  const go = (s) => setScreen(s === null ? "done" : s);

  let body;
  if (screen === "done") {
    body = <Done plat={plat} go={go} />;
  } else {
    const Comp = AUTH_SCREEN_COMPONENTS[screen] || AUTH_SCREEN_COMPONENTS.signin;
    body = <Comp key={platform + screen + tone} plat={plat} tone={tone} go={go} />;
  }

  return (
    <>
      <div className="nav">
        <div className="nav-brand"><span className="dot"></span>Auth suite</div>
        <div className="nav-tabs">
          {AUTH_PLATFORM_ORDER.map((k) => (
            <button key={k} className={"nav-tab" + (platform === k ? " on" : "")}
              onClick={() => { setPlatform(k); if (screen === "done") setScreen("signin"); }}>
              <span className="sw" style={{ background: SWATCH[k] }}></span>{AUTH_PLATFORMS[k].label}
            </button>
          ))}
        </div>
        <div className="nav-spacer"></div>
        <div className="nav-group">
          <span className="nav-label">Screen</span>
          <div className="nav-screens">
            {AUTH_SCREENS.map((s) => (
              <button key={s.key} className={screen === s.key ? "on" : ""} onClick={() => setScreen(s.key)}>{s.label}</button>
            ))}
          </div>
        </div>
        <div className="nav-group">
          <span className="nav-label">Tone</span>
          <div className="nav-seg">
            {AUTH_TONE_ORDER.map((k) => (
              <button key={k} className={tone === k ? "on" : ""} onClick={() => setTone(k)}>{AUTH_TONES[k].label}</button>
            ))}
          </div>
        </div>
      </div>
      <div className="auth-canvas">{body}</div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
